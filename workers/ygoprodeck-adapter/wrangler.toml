name = "ygoprodeck-adapter"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "ygoprodeck-adapter"
PHASE = "1"

[triggers]
crons = ["0 */6 * * *"]

[env.production]
name = "ygoprodeck-adapter"
vars = { SERVICE = "ygoprodeck-adapter", PHASE = "1" }

[env.preview]
name = "ygoprodeck-adapter-preview"
vars = { SERVICE = "ygoprodeck-adapter", PHASE = "1" }
