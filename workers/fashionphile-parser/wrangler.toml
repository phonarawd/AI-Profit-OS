name = "fashionphile-parser"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "fashionphile-parser"
PHASE = "1"

[triggers]
crons = ["*/30 * * * *"]

[env.production]
name = "fashionphile-parser"
vars = { SERVICE = "fashionphile-parser", PHASE = "1" }

[env.preview]
name = "fashionphile-parser-preview"
vars = { SERVICE = "fashionphile-parser", PHASE = "1" }
