name = "chain-sweeper"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "chain-sweeper"
PHASE = "1"

# Phase1 cron — Nest owns Phase0 in-process tick.
# Secrets (named env, not inherited vars): NEST_SWEEP_TICK_URL,
# NEST_RECONCILE_TICK_URL, INTERNAL_WALLET_TICK_TOKEN.
[triggers]
crons = ["*/2 * * * *"]

[env.production]
name = "chain-sweeper"
vars = { SERVICE = "chain-sweeper", PHASE = "1" }

[env.preview]
name = "chain-sweeper-preview"
vars = { SERVICE = "chain-sweeper", PHASE = "1" }
