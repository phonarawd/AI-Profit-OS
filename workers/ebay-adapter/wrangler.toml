name = "ebay-adapter"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "ebay-adapter"
PHASE = "1"
EBAY_MARKETPLACES = "EBAY_US,EBAY_GB"
PRODUCTION_SOURCE_MODE = "operator_only"
ALLOW_EXTERNAL_PRODUCT_INGEST = "false"
ALLOW_LEGACY_EXTERNAL_WRITES = "false"

# Parser 코드는 유지. 운영 cron 은 비활성. 재활성은 env+배포.
[triggers]
crons = []

[env.production]
name = "ebay-adapter"
vars = { SERVICE = "ebay-adapter", PHASE = "1", EBAY_MARKETPLACES = "EBAY_US,EBAY_GB", PRODUCTION_SOURCE_MODE = "operator_only", ALLOW_EXTERNAL_PRODUCT_INGEST = "false", ALLOW_LEGACY_EXTERNAL_WRITES = "false" }

[env.preview]
name = "ebay-adapter-preview"
vars = { SERVICE = "ebay-adapter", PHASE = "1", EBAY_MARKETPLACES = "EBAY_US,EBAY_GB", PRODUCTION_SOURCE_MODE = "operator_only", ALLOW_EXTERNAL_PRODUCT_INGEST = "false", ALLOW_LEGACY_EXTERNAL_WRITES = "false" }
