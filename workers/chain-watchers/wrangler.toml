name = "chain-watchers"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "chain-watchers"
PHASE = "1"

# Phase1 cron — single USDT contract stream (not per-address)
[triggers]
crons = ["*/1 * * * *"]

[env.production]
name = "chain-watchers"
vars = { SERVICE = "chain-watchers", PHASE = "1" }

[env.preview]
name = "chain-watchers-preview"
vars = { SERVICE = "chain-watchers", PHASE = "1" }
