name = "yahoo-jp-adapter"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "yahoo-jp-adapter"
PHASE = "1"

# Phase1+ cron — Yahoo! JAPAN Auction official partner (v7.22.41)
[triggers]
crons = ["*/20 * * * *"]

[env.production]
name = "yahoo-jp-adapter"
vars = { SERVICE = "yahoo-jp-adapter", PHASE = "1" }

[env.preview]
name = "yahoo-jp-adapter-preview"
vars = { SERVICE = "yahoo-jp-adapter", PHASE = "1" }
