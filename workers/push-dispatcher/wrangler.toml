name = "push-dispatcher"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVICE = "push-dispatcher"
PHASE = "0"
PUSH_ENABLED = "true"

[env.production]
name = "push-dispatcher"
vars = { SERVICE = "push-dispatcher", PHASE = "0" }

[env.preview]
name = "push-dispatcher-preview"
