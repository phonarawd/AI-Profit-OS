name: "AI Profit OS CodeQL"
queries:
  - uses: security-extended
paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.open-next/**"
  - "**/coverage/**"
query-filters:
  # HttpOnly Nest JWT session cookie — intentional Set-Cookie of accessToken.
  - exclude:
      id: js/clear-text-storage-of-sensitive-data
      paths:
        - services/api-nest/src/auth/auth.controller.ts
  # Double-submit CSRF readable cookie — proven design.
  - exclude:
      id: js/clear-text-storage-of-sensitive-data
      paths:
        - services/api-nest/src/common/admin-session.cookies.ts
  # Static source-text host presence scans in verify tooling (not runtime URL validation).
  - exclude:
      id: js/incomplete-url-substring-sanitization
      paths:
        - tooling/verify/signup-ready-adapters.cjs
  - exclude:
      id: js/regex/missing-regexp-anchor
      paths:
        - tooling/verify/signup-ready-adapters.cjs
  # Verifier catch path logs Error.message only after hardening.
  - exclude:
      id: js/log-injection
      paths:
        - tooling/verify/adapter-ingest-fail-closed.runtime.cjs