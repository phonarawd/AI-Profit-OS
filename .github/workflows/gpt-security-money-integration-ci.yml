name: gpt-security-money-integration-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-money-integration-e4961df

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Static security and money invariants
        run: |
          set -euo pipefail
          node tooling/verify/tron-address-fail-closed.cjs
          node tooling/verify/withdraw-stepup-security.cjs
          node tooling/verify/usdt-ingest-machine-auth.cjs
          pnpm verify:money-wallet-auth-remediation

      - name: Auth identity verifier
        run: pnpm verify:auth-identity-proof

      - name: Build exact Nest integration
        run: pnpm --filter @aipo/api-nest... build

      - name: Runtime security and money proofs
        run: |
          set -euo pipefail
          node tooling/verify/passkey-registration-hijack.runtime.cjs
          node tooling/verify/webauthn-user-presence.runtime.cjs
          node tooling/verify/tron-address-fail-closed.runtime.cjs
          node tooling/verify/withdraw-stepup-security.runtime.cjs

      - name: Gate fast integration
        env:
          AIPO_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: pnpm verify:gate:fast
