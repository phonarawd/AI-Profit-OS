name: gpt-krw-rng-security-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-krw-rng-ca93c2a

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: node tooling/verify/krw-deposit-unbiased-suffix.cjs
      - run: pnpm --filter @aipo/api-nest... build
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - id: codeql
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          output: /tmp/codeql-sarif
          upload: never
          upload-database: false
      - name: Assert biased-random finding absent
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.SARIF_DIR || "/tmp/codeql-sarif";
          const hits = [];
          for (const f of fs.readdirSync(root).filter(x => x.endsWith(".sarif"))) {
            const s = JSON.parse(fs.readFileSync(path.join(root, f), "utf8"));
            for (const run of s.runs || []) for (const r of run.results || []) {
              const file = r.locations?.[0]?.physicalLocation?.artifactLocation?.uri || "";
              if (r.ruleId === "js/biased-cryptographic-random" &&
                  file.endsWith("services/api-nest/src/wallet/krw-deposit.service.ts")) hits.push({ruleId:r.ruleId,file});
            }
          }
          if (hits.length) {
            console.error(JSON.stringify(hits, null, 2));
            process.exit(1);
          }
          console.log("[gpt-krw-rng-security] PASS targeted finding absent");
          NODE
