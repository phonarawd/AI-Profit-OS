name: rel-502-qa7-formal-publish-once

on:
  push:
    branches:
      - release/auth-wallet-rel502-v1-20260828

permissions:
  contents: write
  actions: read

concurrency:
  group: rel-502-qa7-formal-publish-once
  cancel-in-progress: false

env:
  AIPO_QA7_SOURCE_RUN_ID: "33155687092"
  AIPO_QA7_SOURCE_HEAD_SHA: "5becf28a55f72a47636948d05f69f3bafbca9f70"
  AIPO_QA7_SOURCE_BRANCH: "release/auth-wallet-rel502-v1-20260828"
  AIPO_QA7_ARTIFACT_ID: "9679543726"
  AIPO_QA7_ARTIFACT_EXPIRES_AT: "2026-11-26T08:31:30Z"
  AIPO_QA7_BASELINE_ID: "ea-baseline-cc627efc3ee2-defdfa5b6ac4"
  AIPO_QA7_MARKER: "chore(rel-502): start QA7 formal publication"
  AIPO_QA7_PUBLISH_SUBJECT: "chore(engine-acceptance): publish current-epoch QA7 evidence"

jobs:
  publish:
    if: >-
      github.repository == 'phonarawd/AI-Profit-OS' &&
      github.ref == 'refs/heads/release/auth-wallet-rel502-v1-20260828' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(rel-502): start QA7 formal publication'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Fail-closed epoch guard
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "phonarawd/AI-Profit-OS"
          test "${GITHUB_REF}" = "refs/heads/${AIPO_QA7_SOURCE_BRANCH}"
          test "$(git log -1 --pretty=%s)" = "${AIPO_QA7_MARKER}"
          test -z "$(git status --porcelain)"
          test "$(node -p "require('./governance/engine-acceptance/baseline.v1.json').id")" = "${AIPO_QA7_BASELINE_ID}"
          test "$(node -p "require('./governance/engine-acceptance/evidence-manifest.v1.json').qa_phase")" = "QA-6"
          test "$(node -p "require('./governance/engine-acceptance/evidence-manifest.v1.json').next")" = "QA7_AI_EVAL"
          test "$(node -p "require('./governance/engine-acceptance/evidence-manifest.v1.json').suites.find(x=>x.suite_id==='QA7').completion_status")" = "NOT_STARTED"

      - name: Download exact successful QA7 artifact
        uses: actions/download-artifact@v4
        with:
          repository: phonarawd/AI-Profit-OS
          run-id: 33155687092
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: engine-acceptance-QA7-raw-traces
          path: /tmp/aipo-qa7-source

      - name: Validate artifact and locate trace directory
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          summary="$(find /tmp/aipo-qa7-source -type f -name qa7-local-summary.json -print -quit)"
          test -n "${summary}"
          dir="$(dirname "${summary}")"
          test "$(find "${dir}" -maxdepth 1 -type f -name '*.trace.json' | wc -l | tr -d ' ')" = "26"
          test "$(node -p "require('${summary}').baseline_id")" = "${AIPO_QA7_BASELINE_ID}"
          test "$(node -p "require('${summary}').suite_status")" = "PASS"
          test "$(node -p "require('${summary}').counts.total")" = "26"
          test "$(node -p "require('${summary}').counts.pass")" = "26"
          test "$(node -p "require('${summary}').counts.fail")" = "0"
          test "$(node -p "require('${summary}').counts.blocked")" = "0"
          test "$(node -p "require('${summary}').counts.graded")" = "26"
          printf 'artifact_dir=%s\n' "${dir}" >> "${GITHUB_OUTPUT}"

      - name: Run official QA7 formal publisher
        shell: bash
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/publish-qa7-formal.cjs \
            --actions-run-id "${AIPO_QA7_SOURCE_RUN_ID}" \
            --artifact-dir "${{ steps.artifact.outputs.artifact_dir }}" \
            --head-sha "${AIPO_QA7_SOURCE_HEAD_SHA}" \
            --head-branch "${AIPO_QA7_SOURCE_BRANCH}" \
            --workflow-name engine-acceptance \
            --event workflow_dispatch \
            --qa-phase qa7 \
            --conclusion success \
            --artifact-id "${AIPO_QA7_ARTIFACT_ID}" \
            --artifact-expires-at "${AIPO_QA7_ARTIFACT_EXPIRES_AT}" \
            --run-url "https://github.com/phonarawd/AI-Profit-OS/actions/runs/${AIPO_QA7_SOURCE_RUN_ID}"

      - name: Validate formal publication
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('governance/engine-acceptance/qa7-result.v1.json','utf8'));
          const e=JSON.parse(fs.readFileSync('governance/engine-acceptance/evidence-manifest.v1.json','utf8'));
          const r=fs.readFileSync('governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md','utf8');
          const bad=m=>{throw new Error(m)};
          const c=q.counts||{};
          if(q.baseline_id!==process.env.AIPO_QA7_BASELINE_ID) bad('baseline');
          if(String(q.run_id)!==process.env.AIPO_QA7_SOURCE_RUN_ID) bad('run');
          if(q.completion_status!=='COMPLETE'||q.qa7_completion_status!=='COMPLETE') bad('complete');
          if(q.formal_actions_evidence!==true||q.local_validation_only!==false||q.suite_status!=='PASS') bad('formal');
          if(c.total!==26||c.pass!==26||c.fail!==0||c.blocked!==0||c.graded!==26) bad('counts');
          if(q.actions?.head_sha!==process.env.AIPO_QA7_SOURCE_HEAD_SHA) bad('head');
          if(String(q.artifact?.artifact_id)!==process.env.AIPO_QA7_ARTIFACT_ID) bad('artifact');
          if(e.qa_phase!=='QA-7'||e.next!=='QA8_SECURITY_PRIVACY'||e.verdict!=='ENGINE_QA_INCOMPLETE'||e.evidence_integrity!=='VALID') bad('evidence');
          const s7=(e.suites||[]).find(x=>x.suite_id==='QA7'), s8=(e.suites||[]).find(x=>x.suite_id==='QA8');
          if(!s7||s7.completion_status!=='COMPLETE'||String(s7.run_id)!==process.env.AIPO_QA7_SOURCE_RUN_ID||s7.checksum!==q.checksum) bad('slot7');
          if(!s8||s8.completion_status!=='NOT_STARTED'||s8.run_id!==null||s8.checksum!==null) bad('slot8');
          const ci=e.critical_invariant||{};
          if(ci.blocked!==0||ci.skipped!==0||ci.uncovered!==0||ci.failed!==0) bad('critical');
          if(!r.includes('QA7 = COMPLETE')||!r.includes('NEXT = QA8_SECURITY_PRIVACY')||!r.includes('ENGINE_ACCEPTED_FOR_UI = NOT_ISSUED')) bad('report');
          NODE
          node tooling/engine-acceptance/selftest-qa7.cjs
          pnpm verify:engine-acceptance

      - name: Enforce exact diff, commit, and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md
            governance/engine-acceptance/evidence-manifest.v1.json
            governance/engine-acceptance/qa7-result.v1.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${expected[@]}"
          git rm .github/workflows/rel-502-qa7-formal-publish-once.yml
          git diff --cached --check
          git commit -m "${AIPO_QA7_PUBLISH_SUBJECT}"
          git push origin "HEAD:${AIPO_QA7_SOURCE_BRANCH}"
