name: gpt-api-runtime-taint-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-api-runtime-taint-6e455f7
    paths:
      - ".github/workflows/gpt-api-runtime-taint-ci.yml"
      - "tooling/release/api-artifact-runtime-qa.cjs"
      - "tooling/verify/api-artifact-runtime-qa.cjs"
      - "tooling/verify/api-artifact-runtime-taint.cjs"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Existing API runtime verifier
        run: node tooling/verify/api-artifact-runtime-qa.cjs
      - name: Taint boundary verifier
        run: node tooling/verify/api-artifact-runtime-taint.cjs
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze without upload
        id: codeql
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b
        with:
          output: /tmp/codeql-sarif
          upload: never
          upload-database: false
      - name: Assert HTTP-to-file finding absent
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          node <<'NODE'
          const fs=require("node:fs"), path=require("node:path");
          const root=process.env.SARIF_DIR||"/tmp/codeql-sarif";
          const hits=[];
          for(const f of fs.readdirSync(root).filter(x=>x.endsWith(".sarif"))){
            const s=JSON.parse(fs.readFileSync(path.join(root,f),"utf8"));
            for(const run of s.runs||[]) for(const r of run.results||[]){
              const file=r.locations?.[0]?.physicalLocation?.artifactLocation?.uri||"";
              if(r.ruleId==="js/http-to-file-access" && file.endsWith("tooling/release/api-artifact-runtime-qa.cjs")) hits.push({ruleId:r.ruleId,file});
            }
          }
          if(hits.length){console.error(JSON.stringify(hits,null,2));process.exit(1);}
          console.log("[gpt-api-runtime-taint] PASS targeted finding absent");
          NODE
