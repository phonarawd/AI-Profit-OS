name: gpt-webkit-loopback-csp

on:
  pull_request:
    branches:
      - recovery/release-provenance-20260831
    paths:
      - tooling/security/http-headers.cjs
      - tooling/verify/rel-401-security-headers.cjs
      - .github/workflows/gpt-webkit-loopback-csp-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-header-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify Production vs loopback CSP contract
        run: node tooling/verify/rel-401-security-headers.cjs

  webkit-home-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: WebKit Home session resolution
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
          LOCAL_WEB_RUNTIME_API_STUB: "1"
          API_HOST: "127.0.0.1:4000"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.cross-browser.config.cjs
          --project=webkit
          tooling/e2e/specs/webkit-home-session.spec.cjs
