name: REL-602 staging rollback once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rel-602-staging-rollback-once
  cancel-in-progress: false

jobs:
  staging-rollback-drill:
    if: github.head_ref == 'rel/REL-602-staging-rollback-current'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WEB_KNOWN_GOOD: a85bfa7b-639a-4ad1-b1f3-1ca5f35fb40f
      OPS_KNOWN_GOOD: 81d9b6a2-c5ef-42da-b2e2-46e7af2d4b10
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Hard safety guard
        run: |
          test "${GITHUB_HEAD_REF}" = "rel/REL-602-staging-rollback-current"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q 'ai-profit-web-preview' tooling/deploy/cf-rollback-staging.cjs
          grep -q 'ai-profit-ops-preview' tooling/deploy/cf-rollback-staging.cjs
          grep -q 'production target forbidden' tooling/deploy/cf-rollback-staging.cjs
          pnpm verify:opennext-workers-origin

      - name: Preview API proxy env
        env:
          API_HOST: ${{ secrets.API_HOST }}
        run: |
          API="${API_HOST:-https://ai-profit-os.onrender.com}"
          case "$API" in
            http://*|https://*) ;;
            *) API="https://$API" ;;
          esac
          printf 'API_HOST=%s\n' "$API" >> .env

      - name: Deploy current PR head to staging first
        run: |
          node tooling/deploy/cf-preflight.cjs staging web
          node tooling/deploy/cf-pages-web.cjs staging
          node tooling/deploy/cf-preflight.cjs staging ops
          node tooling/deploy/cf-pages-ops.cjs staging
          node tooling/deploy/cf-origin-smoke.cjs all staging

      - name: Capture active current deployment before rollback
        run: |
          pnpm exec wrangler deployments status --config infra/web/wrangler.toml --env preview --name ai-profit-web-preview --json | tee rel602-web-before.json
          pnpm exec wrangler deployments status --config infra/ops/wrangler.toml --env preview --name ai-profit-ops-preview --json | tee rel602-ops-before.json

      - name: Roll back preview workers to REL-600 known-good versions
        run: node tooling/deploy/cf-rollback-staging.cjs staging "$WEB_KNOWN_GOOD" "$OPS_KNOWN_GOOD"

      - name: Verify rollback active versions and smoke
        run: |
          pnpm exec wrangler deployments status --config infra/web/wrangler.toml --env preview --name ai-profit-web-preview --json | tee rel602-web-rollback.json
          pnpm exec wrangler deployments status --config infra/ops/wrangler.toml --env preview --name ai-profit-ops-preview --json | tee rel602-ops-rollback.json
          grep -Fq "$WEB_KNOWN_GOOD" rel602-web-rollback.json
          grep -Fq "$OPS_KNOWN_GOOD" rel602-ops-rollback.json
          node tooling/deploy/cf-origin-smoke.cjs all staging

      - name: Forward deploy current PR head again
        run: |
          node tooling/deploy/cf-preflight.cjs staging web
          node tooling/deploy/cf-pages-web.cjs staging
          node tooling/deploy/cf-preflight.cjs staging ops
          node tooling/deploy/cf-pages-ops.cjs staging
          node tooling/deploy/cf-origin-smoke.cjs all staging

      - name: Verify forward deployment moved off rollback versions
        run: |
          pnpm exec wrangler deployments status --config infra/web/wrangler.toml --env preview --name ai-profit-web-preview --json | tee rel602-web-forward.json
          pnpm exec wrangler deployments status --config infra/ops/wrangler.toml --env preview --name ai-profit-ops-preview --json | tee rel602-ops-forward.json
          if grep -Fq "$WEB_KNOWN_GOOD" rel602-web-forward.json; then
            echo 'web is still on rollback version' >&2
            exit 1
          fi
          if grep -Fq "$OPS_KNOWN_GOOD" rel602-ops-forward.json; then
            echo 'ops is still on rollback version' >&2
            exit 1
          fi

      - name: Upload REL-602 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rel-602-staging-rollback-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            rel602-web-before.json
            rel602-ops-before.json
            rel602-web-rollback.json
            rel602-ops-rollback.json
            rel602-web-forward.json
            rel602-ops-forward.json
