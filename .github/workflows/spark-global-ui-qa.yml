name: spark-global-ui-qa

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/ui/brand/**"
      - "packages/ui/copy/ko/admin.ts"
      - "packages/ui/components/trust/**"
      - "tooling/e2e/specs/admin-spark-shell.spec.cjs"
      - "tooling/e2e/specs/admin-entry-closure.spec.cjs"
      - ".github/workflows/spark-global-ui-qa.yml"

concurrency:
  group: spark-global-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-spark-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: T1 push gate
        env:
          AIPO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:gate:push
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Spark Dash admin browser regression
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/admin-spark-shell.spec.cjs
          tooling/e2e/specs/admin-entry-closure.spec.cjs
