name: spark-global-ui-qa

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/ui/brand/**"
      - "packages/ui/copy/ko/admin.ts"
      - "packages/ui/components/trust/**"
      - "tooling/e2e/specs/admin-spark-shell.spec.cjs"
      - "tooling/e2e/specs/admin-entry-closure.spec.cjs"
      - ".github/workflows/spark-global-ui-qa.yml"

concurrency:
  group: spark-global-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-spark-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Stack lock + secrets
        run: |
          pnpm verify:stack-lock
          pnpm verify:secrets
        # Admin UI regression only. Full T0/T1 + REL-603 owned by gate.yml / consumer-spark-worldclass.
      - name: Spark Dash admin browser regression
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/admin-spark-shell.spec.cjs
          tooling/e2e/specs/admin-entry-closure.spec.cjs
