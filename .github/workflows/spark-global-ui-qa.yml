name: spark-global-ui-qa

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/ui/brand/**"
      - "packages/ui/components/trust/**"
      - "tooling/e2e/specs/admin-spark-shell.spec.cjs"
      - "tooling/e2e/specs/admin-entry-closure.spec.cjs"
      - "tooling/e2e/specs/admin-deposit-settings.spec.cjs"
      - "tooling/e2e/lib/axe-scan.cjs"
      - ".github/workflows/spark-global-ui-qa.yml"

concurrency:
  group: spark-global-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-spark-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: T1 push gate
        run: pnpm verify:gate:push
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Spark Dash admin browser regression
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/admin-spark-shell.spec.cjs
          tooling/e2e/specs/admin-entry-closure.spec.cjs
          tooling/e2e/specs/admin-deposit-settings.spec.cjs
