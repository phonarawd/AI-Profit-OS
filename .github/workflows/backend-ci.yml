            ~/.cargo/registry
            ~/.cargo/git
            services/engine-rust/target
          key: ${{ runner.os }}-cargo-1.85.0-${{ hashFiles('services/engine-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.85.0-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
