# backend-ci — backend-only repository CI (stage: CI replacement).
# Job <-> verifier mapping SSOT = tooling/verify/gate-tiers.cjs CI_JOBS (checked by verify:backend-ci-tiers-sync).
# Every step runs a real verifier; no echo/no-op steps. Aggregate job backend-required is the required status check candidate.
# Documentation: quality/backend-ci.md
name: backend-ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"
  CI: "true"

jobs:
  gate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/backend-setup
      - name: Stub .env for Docker-less stack-lock
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: printf 'SUPABASE_URL=https://mgsytcetsiecllmhcyox.supabase.co\n' > .env
      - name: verify:gate:fast (T0 always + changed-path domain verifiers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          AIPO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AIPO_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            export AIPO_DOMAIN_DIFF_MODE=ci_pr
            export AIPO_PR_BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          pnpm verify:gate:fast

  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/backend-setup
      - name: verify:backend-boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm verify:backend-boundary --json _tmp_backend_boundary/violations.json
      - name: Upload boundary violations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-boundary-violations
          path: _tmp_backend_boundary/
          retention-days: 14
          if-no-files-found: ignore
      - name: verify:backend-ownership-drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm verify:backend-ownership-drift
      - name: verify:backend-ci-tiers-sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          AIPO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AIPO_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            export AIPO_DOMAIN_DIFF_MODE=ci_pr
            export AIPO_PR_BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          pnpm verify:backend-ci-tiers-sync
      - name: verify:domain-by-path-ci
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          AIPO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AIPO_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            export AIPO_DOMAIN_DIFF_MODE=ci_pr
            export AIPO_PR_BASE_SHA="$(git merge-base origin/main HEAD)"
