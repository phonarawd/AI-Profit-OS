name: lighthouse

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      note:
        description: "REL-404 full Lighthouse is reserved. This workflow runs the static budget gate only."
        required: false
        default: "static-budget"

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: REL-404 static budget
        run: pnpm verify:rel-404-lighthouse-budget
