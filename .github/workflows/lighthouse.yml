name: lighthouse

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      note:
        description: "REL-404 full Lighthouse is reserved. This workflow runs the static budget gate only."
        required: false
        default: "static-budget"

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: REL-404 static budget
        run: pnpm verify:rel-404-lighthouse-budget
