name: gpt-stepup-host-linear-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-stepup-host-linear-72ca41f
    paths:
      - ".github/workflows/gpt-stepup-host-linear-ci.yml"
      - "services/api-nest/src/wallet/withdraw-stepup.policy.ts"
      - "tooling/verify/stepup-host-normalization.cjs"
      - "tooling/verify/withdraw-stepup-security.cjs"
      - "tooling/verify/withdraw-stepup-security.runtime.cjs"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Static host-normalization proof
        run: node tooling/verify/stepup-host-normalization.cjs
      - name: Build Nest API
        run: pnpm --filter @aipo/api-nest... build
      - name: Existing withdraw step-up static proof
        run: node tooling/verify/withdraw-stepup-security.cjs
      - name: Existing withdraw step-up runtime proof
        run: node tooling/verify/withdraw-stepup-security.runtime.cjs
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze without upload
        id: codeql
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          output: "/tmp/codeql-sarif"
          upload: never
          upload-database: false
      - name: Assert step-up ReDoS finding absent
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.SARIF_DIR || "/tmp/codeql-sarif";
          const hits = [];
          for (const file of fs.readdirSync(root).filter((f) => f.endsWith(".sarif"))) {
            const sarif = JSON.parse(fs.readFileSync(path.join(root, file), "utf8"));
            for (const run of sarif.runs || []) for (const result of run.results || []) {
              const uri = result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || "";
              if (result.ruleId === "js/polynomial-redos" && uri.replace(/^file:\/\//, "") === "services/api-nest/src/wallet/withdraw-stepup.policy.ts") hits.push({ ruleId: result.ruleId, file: uri });
            }
          }
          if (hits.length) {
            console.error(JSON.stringify({ targeted_codeql_findings: hits }, null, 2));
            process.exit(1);
          }
          console.log("[gpt-stepup-host-linear] PASS targeted finding absent");
          NODE
