# rerun-v2: selftest live snapshot made epoch-aware
name: engine-rebase-approved-once

on:
  push:
    branches:
      - recovery/release-provenance-20260831
    paths:
      - ".github/workflows/engine-rebase-approved-once.yml"

permissions:
  contents: write

concurrency:
  group: engine-rebase-approved-once
  cancel-in-progress: false

env:
  APPROVED_PRODUCT_SHA: 3c46ac2daaf99d93d93f12c4e2085d51ccec564a
  PREDECESSOR_BASELINE_ID: ea-baseline-04ef3c7de4dd-2ff1760b7d72
  ACK_STATEMENT: >-
    ACK APPROVED ENGINE_ACCEPTANCE_REBASE_V1: recovery/release-provenance-20260831 exact head
    3c46ac2daaf99d93d93f12c4e2085d51ccec564a 및 predecessor baseline
    ea-baseline-04ef3c7de4dd-2ff1760b7d72 기준의 현재 protected-scope drift를 새로운 acceptance epoch로
    formal rebase하는 것을 승인한다. Predecessor evidence/hash washing은 금지하며, current epoch에서
    QA0 → QA1~QA8 → QA9를 실제 재실행하고 검증 결과가 충족될 때만 FINAL_ACCEPTANCE = ISSUED로 전환한다.
    이 ACK는 Production migration apply 또는 Production deploy를 승인하지 않는다.

jobs:
  formal-rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: recovery/release-provenance-20260831

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Verify approved SHA ancestry and protected-scope immutability
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$APPROVED_PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$APPROVED_PRODUCT_SHA"..HEAD -- services/api-nest services/engine-rust schemas eval supabase/migrations)"
          if [ -n "$changed" ]; then
            echo "Protected scope changed after approved exact head:"
            echo "$changed"
            exit 1
          fi
          current_baseline="$(node -p "require('./governance/engine-acceptance/baseline.v1.json').id")"
          test "$current_baseline" = "$PREDECESSOR_BASELINE_ID"
          echo "approved_sha=$APPROVED_PRODUCT_SHA"
          echo "protected_scope_delta_after_ack=0"
          echo "predecessor=$current_baseline"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formal rebase dry-run
        shell: bash
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/rebase-acceptance-baseline.cjs \
            --dry-run \
            --predecessor "$PREDECESSOR_BASELINE_ID" \
            --product-commit "$APPROVED_PRODUCT_SHA" \
            --ack-by "Human/PO" \
            --ack-statement "$ACK_STATEMENT"

      - name: Apply formal rebase
        shell: bash
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/rebase-acceptance-baseline.cjs \
            --apply \
            --predecessor "$PREDECESSOR_BASELINE_ID" \
            --product-commit "$APPROVED_PRODUCT_SHA" \
            --ack-by "Human/PO" \
            --ack-statement "$ACK_STATEMENT"

      - name: Verify rebase pending-rerun state
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify:engine-acceptance
          node - <<'NODE'
          const baseline = require("./governance/engine-acceptance/baseline.v1.json");
          const evidence = require("./governance/engine-acceptance/evidence-manifest.v1.json");
          const ledger = require("./governance/engine-acceptance/product-rebases.v1.json");
          const tip = ledger.rebases[ledger.rebases.length - 1];
          const fails = [];
          if (baseline.epoch?.decision_id !== "ENGINE_ACCEPTANCE_REBASE_V1") fails.push("baseline decision");
          if (baseline.epoch?.predecessor_baseline_id !== process.env.PREDECESSOR_BASELINE_ID) fails.push("baseline predecessor");
          if (tip?.product_commit !== process.env.APPROVED_PRODUCT_SHA) fails.push("ledger product_commit");
          if (tip?.human_po_ack?.statement !== process.env.ACK_STATEMENT) fails.push("ACK statement mismatch");
          if (evidence.qa_phase !== "QA-0") fails.push("evidence qa_phase");
          if (evidence.next !== "QA1_DETERMINISTIC_TRUTH") fails.push("evidence next");
          if (evidence.verdict !== "ENGINE_QA_INCOMPLETE") fails.push("evidence verdict");
          if (fails.length) {
            console.error(fails);
            process.exit(1);
          }
          console.log("formal_rebase_state=PASS");
          console.log("new_baseline_id=" + baseline.id);
          console.log("rebase_id=" + baseline.epoch.rebase_id);
          NODE

      - name: Commit canonical rebase outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-Profit-OS Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add governance/engine-acceptance/
          if git diff --cached --quiet; then
            echo "No canonical rebase outputs changed"
            exit 1
          fi
          git commit -m "chore(engine): apply approved acceptance rebase"
          git push origin HEAD:recovery/release-provenance-20260831
