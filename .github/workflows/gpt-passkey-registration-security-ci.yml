name: gpt-passkey-registration-security-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-passkey-register-hijack-e4961df
    paths:
      - ".github/workflows/gpt-passkey-registration-security-ci.yml"
      - "services/api-nest/src/auth/auth.service.ts"
      - "services/api-nest/src/auth/passkey-registration.policy.ts"
      - "tooling/verify/auth-identity-proof.runtime.cjs"
      - "tooling/verify/passkey-registration-hijack.runtime.cjs"
      - "services/api-nest/package.json"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Existing auth identity verifier
        run: pnpm verify:auth-identity-proof
      - name: Build Nest auth runtime
        run: pnpm --filter @aipo/api-nest... build
      - name: Duplicate passkey registration runtime proof
        run: node tooling/verify/passkey-registration-hijack.runtime.cjs
