name: gpt-staging-topology-readiness-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/staging-topology-readiness-8a1d4d4
    paths:
      - ".github/workflows/gpt-staging-topology-readiness-ci.yml"
      - ".github/workflows/deploy-staging.yml"
      - "tooling/deploy/lib/non-prod-api-host.cjs"
      - "tooling/release/staging-topology-readiness.cjs"
      - "tooling/verify/staging-topology-readiness.cjs"
      - "governance/release-master/rel-b3-promotion/b3-promotion.v1.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify true staging topology contract
        run: node tooling/verify/staging-topology-readiness.cjs
