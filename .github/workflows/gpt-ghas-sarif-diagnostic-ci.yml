name: gpt-ghas-sarif-diagnostic-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/ghas-sarif-diagnostic-305c4e3
    paths:
      - ".github/workflows/gpt-ghas-sarif-diagnostic-ci.yml"

jobs:
  analyze:
    name: codeql-sarif-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main-base
            target_sha: 2e75a13be17f32ff5337851f426f22aa777d86b9
          - label: recovery-head
            target_sha: ea73c85962609c3c88faf0fefe1a18d32247e3c6
          - label: pr114-merge
            target_sha: 4fdc6f94714eed273790047fdd0b532598d5e451
    steps:
      - name: Checkout exact target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.target_sha }}
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze without uploading
        id: analyze
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          category: "/language:javascript-typescript"
          output: "/tmp/codeql-sarif"
          upload: never
          upload-database: false

      - name: Emit sanitized SARIF summary
        env:
          LABEL: ${{ matrix.label }}
          TARGET_SHA: ${{ matrix.target_sha }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.SARIF_DIR || "/tmp/codeql-sarif";
          const label = process.env.LABEL;
          const targetSha = process.env.TARGET_SHA;
          const files = fs.readdirSync(root).filter((f) => f.endsWith(".sarif")).sort();
          if (!files.length) throw new Error("no SARIF files found");

          const findings = [];
          for (const file of files) {
            const sarif = JSON.parse(fs.readFileSync(path.join(root, file), "utf8"));
            for (const run of sarif.runs || []) {
              const rules = new Map();
              for (const rule of run.tool?.driver?.rules || []) {
                rules.set(rule.id, rule);
              }
              for (const result of run.results || []) {
                const loc = result.locations?.[0]?.physicalLocation || {};
                const region = loc.region || {};
                const rule = rules.get(result.ruleId) || {};
                findings.push({
                  ruleId: result.ruleId || null,
                  level: result.level || rule.defaultConfiguration?.level || null,
                  securitySeverity:
                    rule.properties?.["security-severity"] ??
                    rule.properties?.securitySeverity ??
                    null,
                  file: loc.artifactLocation?.uri || null,
                  line: region.startLine || null,
                  message: String(result.message?.text || "").replace(/[\r\n\u0000\u2028\u2029]/g, " ").slice(0, 220),
                  fingerprint:
                    result.partialFingerprints?.primaryLocationLineHash ??
                    result.partialFingerprints?.primaryLocationStartColumnFingerprint ??
                    null,
                });
              }
            }
          }

          findings.sort((a, b) =>
            String(a.ruleId).localeCompare(String(b.ruleId)) ||
            String(a.file).localeCompare(String(b.file)) ||
            Number(a.line || 0) - Number(b.line || 0)
          );

          console.log(JSON.stringify({
            schema: "gpt.codeql-sarif-summary.v1",
            label,
            targetSha,
            count: findings.length,
            findings,
          }, null, 2));
          NODE
