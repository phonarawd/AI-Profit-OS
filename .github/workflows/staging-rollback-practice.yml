name: staging-rollback-practice

on:
  workflow_dispatch:
    inputs:
      surface:
        description: "Staging worker surface to practice rollback on"
        required: true
        default: web
        type: choice
        options:
          - web
          - ops
      known_good_version:
        description: "Cloudflare Worker version UUID to roll back to (REL-600 baseline or wrangler versions list)"
        required: true
        type: string
      forward_after:
        description: "Re-deploy current commit to staging after rollback smoke passes"
        required: true
        default: true
        type: boolean

concurrency:
  group: cf-staging-rollback-${{ github.ref }}-${{ inputs.surface }}
  cancel-in-progress: false

jobs:
  rollback-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Record versions before
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tooling/deploy/cf-worker-versions.cjs ${{ inputs.surface }} staging > rel-602-before.json
          cat rel-602-before.json

      - name: Rollback to known-good
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tooling/deploy/cf-worker-rollback.cjs ${{ inputs.surface }} "${{ inputs.known_good_version }}" staging | tee rel-602-rollback.log

      - name: Record versions after rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tooling/deploy/cf-worker-versions.cjs ${{ inputs.surface }} staging > rel-602-after-rollback.json
          cat rel-602-after-rollback.json

      - name: Forward deploy current commit
        if: inputs.forward_after == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.surface }}" = "web" ]; then
            node tooling/deploy/cf-preflight.cjs staging web && node tooling/deploy/cf-pages-web.cjs staging
          else
            node tooling/deploy/cf-preflight.cjs staging ops && node tooling/deploy/cf-pages-ops.cjs staging
          fi

      - name: Record versions after forward
        if: inputs.forward_after == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tooling/deploy/cf-worker-versions.cjs ${{ inputs.surface }} staging > rel-602-after-forward.json
          cat rel-602-after-forward.json

      - name: Build practice report
        run: |
          RELEASE_ID="$(pnpm release:id)"
          node -e "
            const fs = require('fs');
            const report = {
              rel: 'REL-602',
              surface: '${{ inputs.surface }}',
              knownGoodVersionId: '${{ inputs.known_good_version }}',
              forwardAfter: ${{ inputs.forward_after }},
              releaseId: process.env.RELEASE_ID,
              githubRun: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              before: JSON.parse(fs.readFileSync('rel-602-before.json','utf8')),
              afterRollback: JSON.parse(fs.readFileSync('rel-602-after-rollback.json','utf8')),
            };
            if (fs.existsSync('rel-602-after-forward.json')) {
              report.afterForward = JSON.parse(fs.readFileSync('rel-602-after-forward.json','utf8'));
            }
            fs.writeFileSync('rel-602-practice-report.json', JSON.stringify(report, null, 2));
          "
          cat rel-602-practice-report.json
        env:
          RELEASE_ID: ${{ github.sha }}

      - name: Upload practice report
        uses: actions/upload-artifact@v4
        with:
          name: rel-602-practice-report-${{ inputs.surface }}
          path: |
            rel-602-practice-report.json
            rel-602-before.json
            rel-602-after-rollback.json
            rel-602-after-forward.json
            rel-602-rollback.log
          if-no-files-found: warn
