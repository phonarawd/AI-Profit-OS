name: gpt-next-security-pin

on:
  pull_request:
    branches:
      - recovery/release-provenance-20260831
    paths:
      - apps/admin/package.json
      - apps/web/package.json
      - packages/ui/package.json
      - pnpm-lock.yaml
      - tooling/verify/next-security-pin.cjs
      - .github/workflows/gpt-next-security-pin-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-security-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.20.0"
          cache: "pnpm"
      - name: Prove frozen lock installs
        run: pnpm install --frozen-lockfile
      - name: Verify exact Next security pin
        run: node tooling/verify/next-security-pin.cjs
      - name: Verify repository Next major contract
        run: pnpm verify:next-major-pin
