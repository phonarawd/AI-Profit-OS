name: deploy-cloudflare

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      surface:
        description: "What to deploy"
        required: true
        default: workers
        type: choice
        options:
          - workers
          - web
          - ops
          - all
      worker_set:
        description: "Worker deployment set"
        required: true
        default: phase0
        type: choice
        options:
          - phase0
          - p0-ebay

concurrency:
  group: cf-deploy-${{ github.ref }}-${{ inputs.surface }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets live in GitHub `production` environment (preview CF target still uses preview wrangler env).
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production branch authority
        if: inputs.target == 'production'
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "FAIL_CLOSED:production_deploy_ref_not_main:$GITHUB_REF"
            exit 1
          }

      - name: Production same-SHA + digest acceptance
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          test "${#SHA}" -eq 40
          mkdir -p _tmp_release_acceptance _tmp_release_bundle
          node tooling/release/fetch-acceptance-artifact.cjs \
            --sha "$SHA" \
            --out _tmp_release_acceptance/verdict.json
          node tooling/release/fetch-release-bundle.cjs \
            --sha "$SHA" \
            --out _tmp_release_bundle
          node tooling/release/bind-qa-artifact.cjs \
            --sha "$SHA" \
            --bundle _tmp_release_bundle \
            --out _tmp_release_acceptance/artifact-qa.json
          DIGEST="$(node -e "const v=require('./_tmp_release_acceptance/verdict.json'); if(!/^[0-9a-f]{64}$/i.test(v.artifact_digest||'')) process.exit(2); process.stdout.write(String(v.artifact_digest).toLowerCase())")"
          node tooling/release/require-accepted-sha.cjs \
            --target production \
            --sha "$SHA" \
            --artifact _tmp_release_acceptance/verdict.json \
            --expected-digest "$DIGEST"

      - name: verify:root-domain-env
        if: inputs.target == 'production'
        run: pnpm verify:root-domain-env

      - name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Production env
        if: inputs.target == 'production'
        env:
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          APP_HOST: ${{ secrets.APP_HOST }}
          OPS_HOST: ${{ secrets.OPS_HOST }}
          API_HOST: ${{ secrets.API_HOST }}
        run: |
          test -n "$ROOT_DOMAIN" || (echo "Missing ROOT_DOMAIN secret" && exit 1)
          printf 'ROOT_DOMAIN=%s\nAPP_HOST=%s\nOPS_HOST=%s\nAPI_HOST=%s\n' \
            "$ROOT_DOMAIN" "${APP_HOST:-app.$ROOT_DOMAIN}" "${OPS_HOST:-ops.$ROOT_DOMAIN}" "${API_HOST:-api.$ROOT_DOMAIN}" >> .env

      # GitHub environment 이름은 바꾸지 않는다. preview는 Production API_HOST를 상속하지 않는다.
      - name: Preview API fail-closed
        if: inputs.target != 'production'
        env:
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          set -euo pipefail
          node tooling/deploy/lib/non-prod-api-host.cjs --write-env

      - name: Guard worker_set / surface
        run: node tooling/deploy/cf-workers.cjs --check-surface "${{ inputs.worker_set }}" "${{ inputs.surface }}"

      - name: Production deploy from accepted artifact
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          DIGEST="$(node -e "const v=require('./_tmp_release_acceptance/verdict.json'); process.stdout.write(String(v.artifact_digest).toLowerCase())")"
          node tooling/release/deploy-from-artifact.cjs \
            --target production \
            --sha "$SHA" \
            --expected-digest "$DIGEST" \
            --bundle _tmp_release_bundle \
            --surface "${{ inputs.surface }}" \
            --worker-set "${{ inputs.worker_set }}"

      - name: Deploy workers
        if: inputs.target != 'production' && (inputs.surface == 'workers' || inputs.surface == 'all')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-workers.cjs "${{ inputs.target }}" "${{ inputs.worker_set }}"

      - name: Origin lock (OpenNext → Workers)
        if: inputs.target != 'production' && (inputs.surface == 'web' || inputs.surface == 'ops' || inputs.surface == 'all')
        run: pnpm verify:opennext-workers-origin

      - name: Deploy web (apps/web required)
        if: inputs.target != 'production' && (inputs.surface == 'web' || inputs.surface == 'all')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-preflight.cjs ${{ inputs.target }} web && node tooling/deploy/cf-pages-web.cjs ${{ inputs.target }}

      - name: Deploy ops (apps/admin required)
        if: inputs.target != 'production' && (inputs.surface == 'ops' || inputs.surface == 'all')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-preflight.cjs ${{ inputs.target }} ops && node tooling/deploy/cf-pages-ops.cjs ${{ inputs.target }}

      - name: Origin smoke (workers.dev HTTP)
        if: inputs.surface == 'web' || inputs.surface == 'ops' || inputs.surface == 'all'
        run: |
          SLOT="production"
          if [ "${{ inputs.target }}" != "production" ]; then
            SLOT="staging"
          fi
          case "${{ inputs.surface }}" in
            web) node tooling/deploy/cf-origin-smoke.cjs web "$SLOT" ;;
            ops) node tooling/deploy/cf-origin-smoke.cjs ops "$SLOT" ;;
            *) node tooling/deploy/cf-origin-smoke.cjs all "$SLOT" ;;
          esac
