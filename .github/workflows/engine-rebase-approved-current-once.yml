name: engine-rebase-approved-current-once

on:
  push:
    branches:
      - recovery/release-provenance-20260831
    paths:
      - ".github/workflows/engine-rebase-approved-current-once.yml"

permissions:
  contents: write

concurrency:
  group: engine-rebase-approved-current-once
  cancel-in-progress: false

env:
  APPROVED_PRODUCT_SHA: ec3c9604d2ab7bb40338e45131a052f9b058b2c3
  PREDECESSOR_BASELINE_ID: ea-baseline-74683b6e39a7-590263f0f273
  EXPECTED_PROTECTED_AGGREGATE: 5ac0f4291966300b4e547c91aa1af172fb20b108f5d45f8612bd9b8f970c65a9
  EXPECTED_SCHEMA_MIGRATION_HASH: 144358cad58a345cc51b231ba562e1c520afdbf430e7e46ddf3b2e50508744de
  EXPECTED_REBASE_ID: ea-rebase-ec3c9604d2ab-5ac0f4291966
  ACK_STATEMENT: >-
    ACK APPROVED ENGINE_ACCEPTANCE_REBASE_V1: Founder approved the signed session-bound admin CSRF
    hardening and exact-current-epoch QA0-QA9 rerun; predecessor evidence must remain historical.

jobs:
  formal-rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: recovery/release-provenance-20260831

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Verify approved SHA ancestry and protected-scope immutability
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$APPROVED_PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$APPROVED_PRODUCT_SHA"..HEAD -- services/api-nest services/engine-rust schemas eval supabase/migrations)"
          if [ -n "$changed" ]; then
            echo "Protected scope changed after approved exact product SHA:"
            echo "$changed"
            exit 1
          fi
          current_baseline="$(node -p "require('./governance/engine-acceptance/baseline.v1.json').id")"
          test "$current_baseline" = "$PREDECESSOR_BASELINE_ID"
          echo "approved_product_sha=$APPROVED_PRODUCT_SHA"
          echo "protected_scope_delta_after_ack=0"
          echo "predecessor=$current_baseline"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formal rebase dry-run
        shell: bash
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/rebase-acceptance-baseline.cjs \
            --dry-run \
            --predecessor "$PREDECESSOR_BASELINE_ID" \
            --product-commit "$APPROVED_PRODUCT_SHA" \
            --ack-by "Human/PO" \
            --ack-statement "$ACK_STATEMENT"

      - name: Apply formal rebase
        shell: bash
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/rebase-acceptance-baseline.cjs \
            --apply \
            --predecessor "$PREDECESSOR_BASELINE_ID" \
            --product-commit "$APPROVED_PRODUCT_SHA" \
            --ack-by "Human/PO" \
            --ack-statement "$ACK_STATEMENT"

      - name: Verify rebase pending-rerun state
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify:engine-acceptance
          node - <<'NODE'
          const baseline = require("./governance/engine-acceptance/baseline.v1.json");
          const evidence = require("./governance/engine-acceptance/evidence-manifest.v1.json");
          const ledger = require("./governance/engine-acceptance/product-rebases.v1.json");
          const tip = ledger.rebases[ledger.rebases.length - 1];
          const fails = [];
          if (baseline.epoch?.decision_id !== "ENGINE_ACCEPTANCE_REBASE_V1") fails.push("baseline decision");
          if (baseline.epoch?.predecessor_baseline_id !== process.env.PREDECESSOR_BASELINE_ID) fails.push("baseline predecessor");
          if (baseline.epoch?.rebase_id !== process.env.EXPECTED_REBASE_ID) fails.push("baseline rebase id");
          if (baseline.protected_scope_manifest?.aggregate !== process.env.EXPECTED_PROTECTED_AGGREGATE) fails.push("protected aggregate");
          if (baseline.protected_scope_manifest?.pathCount !== 491) fails.push("protected path count");
          if (baseline.schema_migration_hash !== process.env.EXPECTED_SCHEMA_MIGRATION_HASH) fails.push("schema migration hash");
          if (tip?.product_commit !== process.env.APPROVED_PRODUCT_SHA) fails.push("ledger product_commit");
          if (tip?.human_po_ack?.statement !== process.env.ACK_STATEMENT) fails.push("ACK statement mismatch");
          if (tip?.changed_protected_paths?.length !== 4) fails.push("changed protected path count");
          if (evidence.qa_phase !== "QA-0") fails.push("evidence qa_phase");
          if (evidence.next !== "QA1_DETERMINISTIC_TRUTH") fails.push("evidence next");
          if (evidence.verdict !== "ENGINE_QA_INCOMPLETE") fails.push("evidence verdict");
          if (fails.length) {
            console.error(fails);
            process.exit(1);
          }
          console.log("formal_rebase_state=PASS");
          console.log("new_baseline_id=" + baseline.id);
          console.log("rebase_id=" + baseline.epoch.rebase_id);
          NODE

      - name: Commit canonical rebase outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI-Profit-OS Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add governance/engine-acceptance/
          if git diff --cached --quiet; then
            echo "No canonical rebase outputs changed"
            exit 1
          fi
          HUSKY=0 git commit -m "chore(engine): apply approved current acceptance rebase"
          HUSKY=0 git push origin HEAD:recovery/release-provenance-20260831