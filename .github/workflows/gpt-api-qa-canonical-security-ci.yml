name: gpt-api-qa-canonical-security-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-api-qa-canonical-38032da

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/verify/api-artifact-runtime-qa.cjs
      - run: node tooling/verify/api-runtime-qa-canonical.cjs
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b
        with:
          languages: javascript-typescript
          queries: security-extended
      - id: codeql
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b
        with:
          output: /tmp/codeql-sarif
          upload: never
          upload-database: false
      - name: Assert targeted finding absent
        env:
          SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          node <<'NODE'
          const fs=require("node:fs"),path=require("node:path");
          const root=process.env.SARIF_DIR||"/tmp/codeql-sarif";
          const hits=[];
          for(const f of fs.readdirSync(root).filter(x=>x.endsWith(".sarif"))){
            const s=JSON.parse(fs.readFileSync(path.join(root,f),"utf8"));
            for(const run of s.runs||[]) for(const r of run.results||[]){
              const file=r.locations?.[0]?.physicalLocation?.artifactLocation?.uri||"";
              if(r.ruleId==="js/http-to-file-access" &&
                 file.endsWith("tooling/release/api-artifact-runtime-qa.cjs")) {
                hits.push({ruleId:r.ruleId,file});
              }
            }
          }
          if(hits.length){console.error(JSON.stringify(hits,null,2));process.exit(1);}
          console.log("[gpt-api-qa-canonical] PASS targeted finding absent");
          NODE
