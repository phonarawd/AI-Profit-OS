name: gpt-engine-rebase-diagnostic-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/engine-rebase-diagnostic-305c4e3
    paths:
      - ".github/workflows/gpt-engine-rebase-diagnostic-ci.yml"
      - "tooling/verify/engine-rebase-diagnostic.cjs"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compute exact Engine rebase diagnostics
        run: node tooling/verify/engine-rebase-diagnostic.cjs
