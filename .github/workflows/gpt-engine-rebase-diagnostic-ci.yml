name: gpt-engine-rebase-diagnostic-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/engine-diagnostic-ca93c2a
    paths:
      - ".github/workflows/gpt-engine-rebase-diagnostic-ci.yml"
      - "tooling/verify/engine-rebase-diagnostic.cjs"

jobs:
  diagnose:
    name: diagnose-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: recovery-head
            target_sha: ca93c2a5d161b94f7949c0a9daade4c93ea64734
          - label: pr114-merge
            target_sha: bda5bfadd97064b659aa600a727d160fc9881d81
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: diagnostic

      - name: Checkout exact target context
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.target_sha }}
          fetch-depth: 1
          path: target

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Compute exact Engine context diagnostics
        env:
          AIPO_DIAG_ROOT: ${{ github.workspace }}/target
          AIPO_DIAG_LABEL: ${{ matrix.label }}
          AIPO_DIAG_SHA: ${{ matrix.target_sha }}
        run: node diagnostic/tooling/verify/engine-rebase-diagnostic.cjs
