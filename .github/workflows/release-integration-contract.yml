name: release-integration-contract

on:
  pull_request:
    branches:
      - recovery/release-provenance-20260831
      - main
    paths:
      - ".github/workflows/release-integration-contract.yml"
      - "tooling/e2e/lib/qa-env-isolation-guard.cjs"
      - "tooling/e2e/fixtures/qa-allowlist.v1.json"
      - "tooling/release/db-hardening-readiness.cjs"
      - "tooling/release/staging-topology-readiness.cjs"
      - "tooling/verify/db-hardening-readiness.cjs"
      - "tooling/verify/staging-db-hardening-rehearsal.cjs"
      - "tooling/verify/production-schema-parity.cjs"
      - "tooling/verify/staging-topology-readiness.cjs"
      - "tooling/verify/qa-env-isolation-staging.cjs"
      - "supabase/migrations/20260902032000_production_schema_parity.sql"
      - "supabase/staging/**"
      - "governance/recovery/staging-db-hardening-snapshot.20260902.v1.json"
      - "governance/release-master/staging-topology.current.v1.json"
      - "governance/release-master/rel-b3-promotion/b3-promotion.v1.json"
      - "governance/db-recon/b3-promotion-ledger.v1.json"
      - "governance/release-inventory/b3-promotion.v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Production schema parity migration contract
        run: node tooling/verify/production-schema-parity.cjs

      - name: DB hardening source contract
        run: node tooling/verify/db-hardening-readiness.cjs

      - name: DB hardening fresh staging snapshot
        run: >-
          node tooling/release/db-hardening-readiness.cjs
          --input governance/recovery/staging-db-hardening-snapshot.20260902.v1.json

      - name: DB hardening rollback rehearsal contract
        run: node tooling/verify/staging-db-hardening-rehearsal.cjs

      - name: Staging topology source contract
        run: node tooling/verify/staging-topology-readiness.cjs

      - name: Staging topology current provider snapshot
        run: >-
          node tooling/release/staging-topology-readiness.cjs
          --input governance/release-master/staging-topology.current.v1.json

      - name: QA environment isolation for real staging
        run: node tooling/verify/qa-env-isolation-staging.cjs
