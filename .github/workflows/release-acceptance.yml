name: release-acceptance

permissions:
  contents: read
  actions: read

on:
  workflow_run:
    workflows: [engine-acceptance]
    types: [completed]
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: "engine-acceptance run id to judge"
        required: true
        type: string

concurrency:
  group: release-acceptance-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect engine-acceptance job results
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RUN_ID: ${{ github.event.workflow_run.id || inputs.engine_run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p _tmp_release_acceptance
          node tooling/release/collect-engine-jobs.cjs \
            --run-id "$ENGINE_RUN_ID" \
            --sha "$SHA" \
            --out _tmp_release_acceptance/jobs.json
      - name: Bind release artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p _tmp_release_acceptance/bundle
          node tooling/release/fetch-release-bundle.cjs \
            --sha "$SHA" \
            --out _tmp_release_acceptance/bundle \
            --optional
          node tooling/release/bind-qa-artifact.cjs \
            --sha "$SHA" \
            --bundle _tmp_release_acceptance/bundle \
            --out _tmp_release_acceptance/artifact-qa.json \
            --optional
      - name: Artifact runtime acceptance
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          node tooling/release/artifact-runtime-qa.cjs \
            --sha "$SHA" \
            --bundle _tmp_release_acceptance/bundle \
            --extract-root . \
            --out _tmp_release_acceptance/artifact-qa.json \
            --optional
      - name: API artifact runtime acceptance
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          node tooling/release/api-artifact-runtime-qa.cjs \
            --sha "$SHA" \
            --bundle _tmp_release_acceptance/bundle \
            --extract-root . \
            --out _tmp_release_acceptance/artifact-qa.json \
            --optional
      - name: Fail-closed release verdict
        run: >
          node tooling/release/release-acceptance-verdict.cjs
          --input _tmp_release_acceptance/jobs.json
          --artifact-qa _tmp_release_acceptance/artifact-qa.json
          | tee _tmp_release_acceptance/verdict.json
      - name: Upload release verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-acceptance-verdict
          path: _tmp_release_acceptance/
          retention-days: 90
          if-no-files-found: error
