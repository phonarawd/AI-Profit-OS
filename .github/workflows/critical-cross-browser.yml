name: critical-cross-browser

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "packages/ui/**"
      - "tooling/e2e/specs/critical-cross-browser.spec.cjs"
      - "tooling/e2e/specs/critical-admin-cross-browser.spec.cjs"
      - "tooling/e2e/specs/webkit-home-session.spec.cjs"
      - "packages/sdk/src/home-read-model/**"
      - "packages/sdk/src/internal/**"
      - "packages/sdk/src/wallet/fetch.ts"
      - "packages/sdk/src/user-feed/fetch.ts"
      - "packages/sdk/src/current-fx/fetch.ts"
      - "tooling/e2e/specs/leftover-browser-web.spec.cjs"
      - "tooling/e2e/lib/local-web-runtime.cjs"
      - "tooling/e2e/playwright.cross-browser.config.cjs"
      - ".github/workflows/critical-cross-browser.yml"

concurrency:
  group: critical-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install browser engine
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Critical consumer ${{ matrix.browser }}
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
          LOCAL_WEB_RUNTIME_API_STUB: "1"
          API_HOST: "127.0.0.1:4000"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.cross-browser.config.cjs
          --project=${{ matrix.browser }}
          tooling/e2e/specs/critical-cross-browser.spec.cjs

  admin-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Admin critical Chromium
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/admin-entry-closure.spec.cjs
          tooling/e2e/specs/critical-admin-cross-browser.spec.cjs

  webkit-home-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: WebKit Home session resolution
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
          LOCAL_WEB_RUNTIME_API_STUB: "1"
          API_HOST: "127.0.0.1:4000"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.cross-browser.config.cjs
          --project=webkit
          tooling/e2e/specs/webkit-home-session.spec.cjs

  leftover-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Leftover 93/95 race
        env:
          CI: "1"
          NEXT_DEV_WEBPACK: "1"
          LEFTOVER_BROWSER: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/leftover-browser-web.spec.cjs
          --grep "ticket93|ticket95"
