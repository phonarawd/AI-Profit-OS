name: provision-ebay-adapter-secrets

permissions:
  contents: read

# production ebay-adapter runtime secrets only.
# Default dry-run = mutation=0. apply uses wrangler secret put
# (Cloudflare publishes a new Worker version immediately).
# Preview copy, unrelated workers, Yahoo/Amazon = forbidden.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run never mutates. apply binds secrets and publishes a Worker version."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      target:
        description: "Exact target"
        required: true
        default: production
        type: choice
        options:
          - production
      worker:
        description: "Exact worker"
        required: true
        default: ebay-adapter
        type: choice
        options:
          - ebay-adapter
      worker_set:
        description: "Exact worker set"
        required: true
        default: p0-ebay
        type: choice
        options:
          - p0-ebay
      confirm_apply:
        description: "Required for apply only: APPLY_PRODUCTION_EBAY_ADAPTER_SECRETS"
        required: false
        default: ""
        type: string

concurrency:
  group: cf-ebay-secrets-production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Guard exact target
        run: |
          set +x
          test "${{ inputs.target }}" = "production" || (echo "target guard failed" && exit 1)
          test "${{ inputs.worker }}" = "ebay-adapter" || (echo "worker guard failed" && exit 1)
          test "${{ inputs.worker_set }}" = "p0-ebay" || (echo "worker_set guard failed" && exit 1)

      - name: Secret presence (names only)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NEST_ADAPTER_INGEST_URL: ${{ secrets.NEST_ADAPTER_INGEST_URL }}
          ADAPTER_INGEST_TOKEN: ${{ secrets.ADAPTER_INGEST_TOKEN }}
        run: |
          set +x
          if [ -n "${EBAY_CLIENT_ID:-}" ]; then echo "EBAY_CLIENT_ID_PRESENT=YES"; else echo "EBAY_CLIENT_ID_PRESENT=NO"; fi
          if [ -n "${EBAY_CLIENT_SECRET:-}" ]; then echo "EBAY_CLIENT_SECRET_PRESENT=YES"; else echo "EBAY_CLIENT_SECRET_PRESENT=NO"; fi
          if [ -n "${NEST_ADAPTER_INGEST_URL:-}" ]; then echo "NEST_ADAPTER_INGEST_URL_PRESENT=YES"; else echo "NEST_ADAPTER_INGEST_URL_PRESENT=NO"; fi
          if [ -n "${ADAPTER_INGEST_TOKEN:-}" ]; then echo "ADAPTER_INGEST_TOKEN_PRESENT=YES"; else echo "ADAPTER_INGEST_TOKEN_PRESENT=NO"; fi

      - name: Dry-run
        if: inputs.mode == 'dry-run'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NEST_ADAPTER_INGEST_URL: ${{ secrets.NEST_ADAPTER_INGEST_URL }}
          ADAPTER_INGEST_TOKEN: ${{ secrets.ADAPTER_INGEST_TOKEN }}
        run: |
          set +x
          node tooling/deploy/cf-ebay-secrets.cjs production --dry-run --target="${{ inputs.target }}" --worker="${{ inputs.worker }}" --worker-set="${{ inputs.worker_set }}"

      - name: Apply (Worker version publish)
        if: inputs.mode == 'apply'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NEST_ADAPTER_INGEST_URL: ${{ secrets.NEST_ADAPTER_INGEST_URL }}
          ADAPTER_INGEST_TOKEN: ${{ secrets.ADAPTER_INGEST_TOKEN }}
          ALLOW_PRODUCTION_EBAY_SECRET_PUT: YES
        run: |
          set +x
          node tooling/deploy/cf-ebay-secrets.cjs production --apply --target="${{ inputs.target }}" --worker="${{ inputs.worker }}" --worker-set="${{ inputs.worker_set }}" --confirm="${{ inputs.confirm_apply }}"
