# REL-502 Auth+Wallet current-epoch one-shot (ADDITIVE · does not edit engine-acceptance.yml)
#
# Canonical scorer mode SSOT = .github/workflows/engine-acceptance.yml
#   QA1 full · QA2 full · QA3 full · QA4 clock + full · QA5 fault + tiny
#   QA6 threshold + full · QA8 adversarial + full PRE-FLIGHT ONLY
# Do not persist QA8 as current formal COMPLETE before QA7 formal.
# Do not copy engine-acceptance-heavy.yml QA4/QA8 tiny scorers.
#
# Bounds:
# - repository phonarawd/AI-Profit-OS
# - branch release/auth-wallet-rel502-v1-20260828 only
# - HEAD subject must be the marker below (one-shot; persist commit uses a different subject)
# - pins current baseline / aggregate / acceptance_workflow_hash / product commit / base main
# - QA7 formal / QA9 / FINAL cert issuance are out of scope
# - persist allowlist = QA1-QA6 formal evidence only
# - persist hook skip is allowed only after compensating controls
#   (QA1-QA6 PASS + QA8 preflight PASS + QA6 snapshot restore + allowlist
#   + secrets + persist-safety cached + cached recheck + race check)
name: rel-502-auth-wallet-current-epoch-once

on:
  push:
    branches:
      - release/auth-wallet-rel502-v1-20260828

concurrency:
  group: rel-502-auth-wallet-current-epoch-once-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  AIPO_QA_TARGET_ENV: ci
  AIPO_QA_HOSTNAME: localhost
  AIPO_QA_SYNTHETIC_NS: qa-synth-ci
  TMPDIR: /tmp
  PORT: 4000
  AIPO_EPOCH_REPOSITORY: phonarawd/AI-Profit-OS
  AIPO_EPOCH_BRANCH: release/auth-wallet-rel502-v1-20260828
  AIPO_EPOCH_MARKER: "fix(rel-502): use qa6 intermediate persist-safety"
  AIPO_EPOCH_PERSIST_SUBJECT: "chore(rel-502): persist current-epoch qa1-qa6 evidence"
  AIPO_EPOCH_BASE_MAIN: 2e75a13be17f32ff5337851f426f22aa777d86b9
  AIPO_EPOCH_BASELINE_ID: ea-baseline-cc627efc3ee2-defdfa5b6ac4
  AIPO_EPOCH_AGGREGATE: defdfa5b6ac45ce3ea03ee2f392b9f8c1a89f84ec5826dede5def6c08b479d23
  AIPO_EPOCH_PATH_COUNT: "452"
  AIPO_EPOCH_WORKFLOW_HASH: b8e724ba3af9e2d240f4daeefd53d4330972afdb942396698389825167752aa7
  AIPO_EPOCH_PRODUCT_COMMIT: cc627efc3ee20e43df4888692e346dca2414e399
  AIPO_QA6_SNAPSHOT: /tmp/aipo-rel502-qa6-governance-snapshot

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_qa: ${{ steps.decide.outputs.run_qa }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Marker / repository / branch guard (skip without mutation)
        id: decide
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "${AIPO_EPOCH_REPOSITORY}" ]; then
            echo "run_qa=false" >> "${GITHUB_OUTPUT}"
            echo "skip: repository mismatch (no mutation)"
            exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/${AIPO_EPOCH_BRANCH}" ]; then
            echo "run_qa=false" >> "${GITHUB_OUTPUT}"
            echo "skip: branch mismatch (no mutation)"
            exit 0
          fi
          subject="$(git log -1 --pretty=%s)"
          if [ "${subject}" != "${AIPO_EPOCH_MARKER}" ]; then
            echo "run_qa=false" >> "${GITHUB_OUTPUT}"
            echo "skip: marker mismatch (no mutation)"
            exit 0
          fi
          echo "run_qa=true" >> "${GITHUB_OUTPUT}"

  qa123:
    # QA1 = full · QA2 = full · QA3 = full
    if: >-
      needs.guard.outputs.run_qa == 'true' &&
      github.repository == 'phonarawd/AI-Profit-OS' &&
      github.ref == 'refs/heads/release/auth-wallet-rel502-v1-20260828' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'fix(rel-502): use qa6 intermediate persist-safety')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [guard]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pin branch + marker + current epoch
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${AIPO_EPOCH_REPOSITORY}"
          test "${GITHUB_REF}" = "refs/heads/${AIPO_EPOCH_BRANCH}"
          test "$(git log -1 --pretty=%s)" = "${AIPO_EPOCH_MARKER}"
          node tooling/verify/rel-502-current-epoch-once.cjs --runtime-pins
          node tooling/verify/rel-502-current-epoch-once.cjs --publication-safety
          pnpm verify:rel-502-final-engine-acceptance
      - name: Kill-switch before QA1-QA3
        run: node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Run QA1 deterministic truth (full)
        run: node tooling/engine-acceptance/run-qa1.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Run QA2 synthetic personas (full)
        run: node tooling/engine-acceptance/run-qa2.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Run QA3 generative fuzz (full)
        run: node tooling/engine-acceptance/run-qa3.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Upload cumulative governance evidence (after QA3)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-evidence-after-qa123
          path: governance/engine-acceptance/
          retention-days: 90
          if-no-files-found: error

  qa4:
    # QA4 = isolated pgvector + real clock harness + canonical full
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [qa123]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipo_qa_synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipo_qa_synth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AIPO_QA_PGHOST: 127.0.0.1
      AIPO_QA_PGUSER: postgres
      AIPO_QA_PGPASSWORD: postgres
      AIPO_QA_PGDATABASE: aipo_qa_synth
      AIPO_QA_PGPORT: "5432"
      AIPO_QA_HARNESS_OUT: /tmp/aipo-harness/qa4-clock
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download QA1-QA3 cumulative evidence
        uses: actions/download-artifact@v4
        with:
          name: epoch-once-evidence-after-qa123
          path: governance/engine-acceptance/
      - name: Isolated DB readiness + kill-switch
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d aipo_qa_synth >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then echo "isolated postgres readiness timeout"; exit 1; fi
            sleep 1
          done
          node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci --assert-db-target
      - name: Build @aipo/api-nest
        run: |
          set -euo pipefail
          pnpm --filter @aipo/api-nest build
          test -f services/api-nest/dist/app.module.js
      - name: Run QA4 real clock executor (in-process boot)
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa4-clock.cjs \
            --target-env ci \
            --hostname localhost \
            --synthetic-ns qa-synth-ci
      - name: Run canonical QA4 (full · consumes fresh harness evidence)
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa4.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Upload QA4 clock harness raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-QA4-clock-harness
          path: /tmp/aipo-harness/qa4-clock/
          retention-days: 90
          if-no-files-found: warn
      - name: Upload cumulative governance evidence (after QA4)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-evidence-after-qa4
          path: governance/engine-acceptance/
          retention-days: 90
          if-no-files-found: error

  qa5:
    # QA5 = isolated pgvector + fault harness + canonical tiny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [qa4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipo_qa_synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipo_qa_synth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AIPO_QA_PGHOST: 127.0.0.1
      AIPO_QA_PGUSER: postgres
      AIPO_QA_PGPASSWORD: postgres
      AIPO_QA_PGDATABASE: aipo_qa_synth
      AIPO_QA_PGPORT: "5432"
      AIPO_QA_HARNESS_OUT: /tmp/aipo-harness/qa5-fault
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download QA4 cumulative evidence
        uses: actions/download-artifact@v4
        with:
          name: epoch-once-evidence-after-qa4
          path: governance/engine-acceptance/
      - name: Isolated DB readiness + kill-switch
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d aipo_qa_synth >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then echo "isolated postgres readiness timeout"; exit 1; fi
            sleep 1
          done
          node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci --assert-db-target
      - name: Build @aipo/api-nest
        run: |
          set -euo pipefail
          pnpm --filter @aipo/api-nest build
          test -f services/api-nest/dist/main.js
      - name: Run QA5 live fault orchestration
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa5-fault.cjs \
            --target-env ci \
            --hostname localhost \
            --synthetic-ns qa-synth-ci
      - name: Run canonical QA5 (tiny · consumes fresh harness evidence)
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa5.cjs --mode tiny --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Upload QA5 fault harness raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-QA5-fault-harness
          path: /tmp/aipo-harness/qa5-fault/
          retention-days: 90
          if-no-files-found: warn
      - name: Upload cumulative governance evidence (after QA5)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-evidence-after-qa5
          path: governance/engine-acceptance/
          retention-days: 90
          if-no-files-found: error

  qa6:
    # QA6 = isolated pgvector + threshold harness + canonical full
    # measurement-only runner remains disconnected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [qa5]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipo_qa_synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipo_qa_synth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AIPO_QA_PGHOST: 127.0.0.1
      AIPO_QA_PGUSER: postgres
      AIPO_QA_PGPASSWORD: postgres
      AIPO_QA_PGDATABASE: aipo_qa_synth
      AIPO_QA_PGPORT: "5432"
      AIPO_QA_HARNESS_OUT: /tmp/aipo-harness/qa6-threshold
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download QA5 cumulative evidence
        uses: actions/download-artifact@v4
        with:
          name: epoch-once-evidence-after-qa5
          path: governance/engine-acceptance/
      - name: Install k6 v0.54.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar -xz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version | grep -F "0.54.0"
      - name: Isolated DB readiness + kill-switch
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d aipo_qa_synth >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then echo "isolated postgres readiness timeout"; exit 1; fi
            sleep 1
          done
          node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci --assert-db-target
      - name: Build @aipo/api-nest
        run: |
          set -euo pipefail
          pnpm --filter @aipo/api-nest build
          test -f services/api-nest/dist/main.js
      - name: Run QA6 real k6 threshold execution
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa6-threshold.cjs \
            --target-env ci \
            --hostname localhost \
            --synthetic-ns qa-synth-ci
      - name: Run canonical QA6 (full · consumes fresh harness evidence)
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa6.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
          node tooling/verify/rel-502-current-epoch-once.cjs --persist-safety
      - name: Upload QA6 threshold harness raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-QA6-threshold-harness
          path: /tmp/aipo-harness/qa6-threshold/
          retention-days: 90
          if-no-files-found: warn
      - name: Upload cumulative governance evidence (after QA6)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-evidence-after-qa6
          path: governance/engine-acceptance/
          retention-days: 90
          if-no-files-found: error

  qa8:
    # QA8 = PRE-FLIGHT ONLY · isolated pgvector + adversarial + canonical full
    # Must not persist QA8 current formal COMPLETE. Restore QA6 snapshot after PASS.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [qa6]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipo_qa_synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipo_qa_synth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AIPO_QA_PGHOST: 127.0.0.1
      AIPO_QA_PGUSER: postgres
      AIPO_QA_PGPASSWORD: postgres
      AIPO_QA_PGDATABASE: aipo_qa_synth
      AIPO_QA_PGPORT: "5432"
      AIPO_QA_HARNESS_OUT: /tmp/aipo-harness/qa8-adversarial
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download QA6 cumulative evidence
        uses: actions/download-artifact@v4
        with:
          name: epoch-once-evidence-after-qa6
          path: governance/engine-acceptance/
      - name: Snapshot QA6 governance before QA8 PRE-FLIGHT ONLY
        run: |
          set -euo pipefail
          rm -rf "${AIPO_QA6_SNAPSHOT}"
          cp -a governance/engine-acceptance "${AIPO_QA6_SNAPSHOT}"
          test -f "${AIPO_QA6_SNAPSHOT}/evidence-manifest.v1.json"
      - name: Isolated DB readiness + kill-switch
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d aipo_qa_synth >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then echo "isolated postgres readiness timeout"; exit 1; fi
            sleep 1
          done
          node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci --assert-db-target
      - name: Build @aipo/api-nest
        run: |
          set -euo pipefail
          pnpm --filter @aipo/api-nest build
          test -f services/api-nest/dist/main.js
      - name: Run QA8 booted-Nest adversarial HTTP
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa8-adversarial.cjs \
            --target-env ci \
            --hostname localhost \
            --synthetic-ns qa-synth-ci
      - name: Run canonical QA8 (full PRE-FLIGHT ONLY · do not persist)
        run: |
          set -euo pipefail
          node tooling/engine-acceptance/run-qa8.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
          node tooling/verify/rel-502-current-epoch-once.cjs --qa8-preflight
      - name: Upload QA8 adversarial harness raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-QA8-adversarial-harness
          path: /tmp/aipo-harness/qa8-adversarial/
          retention-days: 90
          if-no-files-found: warn
      - name: Upload QA8 PRE-FLIGHT ONLY governance (artifact, not persist)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: epoch-once-evidence-qa8-preflight
          path: governance/engine-acceptance/
          retention-days: 90
          if-no-files-found: error
      - name: Restore QA6 governance snapshot (QA8 formal persist forbidden)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -d "${AIPO_QA6_SNAPSHOT}"
          rm -rf governance/engine-acceptance
          cp -a "${AIPO_QA6_SNAPSHOT}" governance/engine-acceptance
          diff -rq "${AIPO_QA6_SNAPSHOT}" governance/engine-acceptance
          node tooling/verify/rel-502-current-epoch-once.cjs --persist-safety

  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [qa8]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach exact release branch at workflow start SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git checkout -B "${AIPO_EPOCH_BRANCH}" "${GITHUB_SHA}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${AIPO_EPOCH_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download QA6 persist source (not QA8 preflight)
        uses: actions/download-artifact@v4
        with:
          name: epoch-once-evidence-after-qa6
          path: governance/engine-acceptance/
      - name: Re-check pins + publication + exact allowlist persist
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${AIPO_EPOCH_REPOSITORY}"
          test "${GITHUB_REF}" = "refs/heads/${AIPO_EPOCH_BRANCH}"
          test "$(git log -1 --pretty=%s)" = "${AIPO_EPOCH_MARKER}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${AIPO_EPOCH_BRANCH}"
          node tooling/verify/rel-502-current-epoch-once.cjs --runtime-pins
          node tooling/verify/rel-502-current-epoch-once.cjs --publication-safety
          node tooling/verify/rel-502-current-epoch-once.cjs --persist-safety

          ALLOW_FILES=(
            "governance/engine-acceptance/qa1-result.v1.json"
            "governance/engine-acceptance/qa2-result.v1.json"
            "governance/engine-acceptance/qa3-result.v1.json"
            "governance/engine-acceptance/qa4-result.v1.json"
            "governance/engine-acceptance/qa5-result.v1.json"
            "governance/engine-acceptance/qa6-result.v1.json"
            "governance/engine-acceptance/evidence-manifest.v1.json"
            "governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md"
            "governance/engine-acceptance/defects.v1.json"
            "governance/engine-acceptance/coverage.v1.json"
          )
          FORBIDDEN_FILES=(
            "governance/engine-acceptance/baseline.v1.json"
            "governance/engine-acceptance/protected-scope.v1.json"
            "governance/engine-acceptance/product-rebases.v1.json"
            "governance/engine-acceptance/qa7-result.v1.json"
            "governance/engine-acceptance/qa8-result.v1.json"
            "governance/engine-acceptance/qa9-result.v1.json"
            "governance/engine-acceptance/FINAL_ACCEPTANCE.md"
          )
          for f in "${FORBIDDEN_FILES[@]}"; do
            if [ -e "$f" ] && ! git diff --quiet HEAD -- "$f"; then
              echo "forbidden persist path changed: $f"
              exit 1
            fi
          done

          staged_any=0
          for f in "${ALLOW_FILES[@]}"; do
            if [ -f "$f" ] && ! git diff --quiet HEAD -- "$f"; then
              git add -- "$f"
              staged_any=1
            fi
          done
          test "${staged_any}" -eq 1

          staged="$(git diff --cached --name-only)"
          test -n "${staged}"
          echo "${staged}" | awk -v allow="$(printf '%s\n' "${ALLOW_FILES[@]}")" '
            BEGIN {
              n = split(allow, a, "\n")
              for (i = 1; i <= n; i++) ok[a[i]] = 1
              bad = 0
            }
            $0 == "" { next }
            !($0 in ok) { print "refusing non-allowlist staged path: " $0; bad = 1 }
            END { exit bad }
          '

          if echo "${staged}" | grep -E '(trace|harness|raw-log)' >/dev/null; then
            echo "raw traces must stay in Actions artifacts"
            exit 1
          fi

          product="$(git diff --cached --name-only -- services/api-nest services/engine-rust schemas eval supabase/migrations || true)"
          test -z "${product}"

          pnpm verify:secrets
          node tooling/verify/rel-502-current-epoch-once.cjs --persist-safety --cached

          staged2="$(git diff --cached --name-only)"
          test "${staged}" = "${staged2}"
          echo "${staged2}" | awk -v allow="$(printf '%s\n' "${ALLOW_FILES[@]}")" '
            BEGIN {
              n = split(allow, a, "\n")
              for (i = 1; i <= n; i++) ok[a[i]] = 1
              bad = 0
            }
            $0 == "" { next }
            !($0 in ok) { print "cached recheck refused: " $0; bad = 1 }
            END { exit bad }
          '

          git fetch --no-tags origin "${AIPO_EPOCH_BRANCH}"
          remote_tip="$(
            git ls-remote --heads origin \
              "refs/heads/${AIPO_EPOCH_BRANCH}" |
            awk 'NR==1 {print $1}'
          )"
          test -n "${remote_tip}"
          if [ "${remote_tip}" != "${GITHUB_SHA}" ]; then
            echo "remote branch tip raced away from GITHUB_SHA"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          HUSKY=0 git commit --no-verify -m "${AIPO_EPOCH_PERSIST_SUBJECT}"
          test "$(git log -1 --pretty=%s)" = "${AIPO_EPOCH_PERSIST_SUBJECT}"
          git push origin HEAD:refs/heads/release/auth-wallet-rel502-v1-20260828
