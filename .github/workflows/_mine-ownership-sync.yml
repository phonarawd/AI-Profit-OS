name: mine-ownership-sync

on:
  push:
    branches: [release/mine-os-control-center-20260925]

permissions:
  contents: write

jobs:
  refresh-and-clean:
    if: github.event.head_commit.message != '[skip-mine-ownership-sync]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ownership graph
        run: node tooling/backend/ownership-graph.cjs || true
      - name: Remove temporary workflow and regenerate against final tree
        run: |
          git rm .github/workflows/_mine-ownership-sync.yml
          node tooling/backend/ownership-graph.cjs || true
      - name: Commit generated ownership artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/backend-file-ownership.json quality/backend-dependency-graph.json
          git diff --cached --quiet || HUSKY=0 git commit --no-verify -m "[skip-mine-ownership-sync]"
          git push origin HEAD:release/mine-os-control-center-20260925
