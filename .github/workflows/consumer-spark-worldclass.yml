name: consumer-spark-worldclass

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "tooling/e2e/lib/local-web-runtime.cjs"
      - "tooling/e2e/specs/consumer-spark-worldclass.spec.cjs"
      - "tooling/verify/pwa-native-shell.cjs"
      - ".github/workflows/consumer-spark-worldclass.yml"

concurrency:
  group: consumer-spark-worldclass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worldclass-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: T1 push gate
        env:
          AIPO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:gate:push
      - name: Cloudflare OpenNext build
        env:
          # Browser visual QA is intentionally isolated from a live backend.
          # The production bundle still exercises the same Worker rewrite contract.
          API_HOST: "127.0.0.1:4010"
        run: pnpm --filter @aipo/web build:cf
      - name: Spark Dash all-route responsive continuity
        env:
          CI: "1"
          API_HOST: "127.0.0.1:4010"
          LOCAL_WEB_RUNTIME_MODE: "production"
          LOCAL_WEB_RUNTIME_API_STUB: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/consumer-spark-worldclass.spec.cjs
