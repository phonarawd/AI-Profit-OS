name: consumer-spark-worldclass

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "tooling/e2e/lib/local-web-runtime.cjs"
      - "tooling/e2e/specs/consumer-spark-worldclass.spec.cjs"
      - "tooling/e2e/lib/four-breakpoint-a11y.cjs"
      - "tooling/e2e/specs/wallet-closure.spec.cjs"
      - "tooling/e2e/specs/usdt-deposit-closure.spec.cjs"
      - "tooling/e2e/specs/krw-deposit-closure.spec.cjs"
      - "tooling/e2e/specs/usdt-withdraw-closure.spec.cjs"
      - "tooling/e2e/specs/krw-withdraw-closure.spec.cjs"
      - "tooling/e2e/specs/transaction-history-closure.spec.cjs"
      - "tooling/e2e/specs/transaction-detail-closure.spec.cjs"
      - "tooling/e2e/specs/kyc-closure.spec.cjs"
      - "tooling/verify/pwa-native-shell.cjs"
      - ".github/workflows/consumer-spark-worldclass.yml"

concurrency:
  group: consumer-spark-worldclass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worldclass-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: T1 push gate
        run: pnpm verify:gate:push
      - name: Cloudflare OpenNext build
        env:
          # Browser visual QA is intentionally isolated from a live backend.
          # The production bundle still exercises the same Worker rewrite contract.
          API_HOST: "127.0.0.1:4010"
        run: pnpm --filter @aipo/web build:cf
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Spark Dash all-route responsive continuity
        env:
          CI: "1"
          API_HOST: "127.0.0.1:4010"
          LOCAL_WEB_RUNTIME_MODE: "production"
          LOCAL_WEB_RUNTIME_API_STUB: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          tooling/e2e/specs/consumer-spark-worldclass.spec.cjs
      - name: Money four-breakpoint A11Y closure
        env:
          CI: "1"
          API_HOST: "127.0.0.1:4010"
          LOCAL_WEB_RUNTIME_MODE: "production"
          LOCAL_WEB_RUNTIME_API_STUB: "1"
        run: >-
          pnpm exec playwright test
          --config=tooling/e2e/playwright.config.cjs
          --workers=1
          --grep "390/768/1024/1440"
          tooling/e2e/specs/wallet-closure.spec.cjs
          tooling/e2e/specs/usdt-deposit-closure.spec.cjs
          tooling/e2e/specs/krw-deposit-closure.spec.cjs
          tooling/e2e/specs/usdt-withdraw-closure.spec.cjs
          tooling/e2e/specs/krw-withdraw-closure.spec.cjs
          tooling/e2e/specs/transaction-history-closure.spec.cjs
          tooling/e2e/specs/transaction-detail-closure.spec.cjs
          tooling/e2e/specs/kyc-closure.spec.cjs
