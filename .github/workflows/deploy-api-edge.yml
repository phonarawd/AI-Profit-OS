name: deploy-api-edge

on:
  push:
    branches:
      - main
    paths:
      - "workers/api-stub/**"
      - ".github/workflows/deploy-api-edge.yml"
      - "workers/_shared/api-origin.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy API Edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9dc502d4ef06b3b5374591de6e6933ca"
        run: pnpm exec wrangler deploy --config workers/api-stub/wrangler.toml --env production
      - name: API health smoke
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 2 --retry-connrefused "https://api.putduk.com/api/v1/health?cb=${GITHUB_SHA}" > /tmp/health.json
          grep -q '"status"' /tmp/health.json

# production deployment retry marker: 2026-09-25
