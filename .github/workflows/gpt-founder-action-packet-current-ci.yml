name: gpt-founder-action-packet-current

on:
  pull_request:
    paths:
      - "governance/recovery/founder-action-packet.current.v1.json"
      - "tooling/verify/founder-action-packet-current.cjs"
      - ".github/workflows/gpt-founder-action-packet-current-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.14.0"
      - name: Verify current Founder action packet
        run: node tooling/verify/founder-action-packet-current.cjs
