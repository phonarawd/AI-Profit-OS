name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: REL-402 dependency audit
        env:
          AIPO_AUDIT: "1"
        run: pnpm verify:rel-402-dependency-audit
      - name: REL-404 lighthouse budget
        run: pnpm verify:rel-404-lighthouse-budget
      - name: REL-405 RBAC audit foundation
        run: pnpm verify:rel-405-rbac-audit
      - name: REL-406 kill switch 9
        run: pnpm verify:rel-406-kill-switch
      - name: REL-407 price override layers
        run: pnpm verify:rel-407-price-override
      - name: REL-408 security baseline
        run: pnpm verify:rel-408-security-baseline

      - name: Adapter worker machine auth
        run: pnpm verify:adapter-worker-machine-auth
      - name: Chain worker machine auth
        run: |
          pnpm verify:chain-worker-machine-auth
          pnpm exec tsc -p workers/chain-watchers/tsconfig.json
          pnpm exec tsc -p workers/chain-sweeper/tsconfig.json
      - name: Marketing CAPI worker machine auth
        run: |
          pnpm verify:marketing-capi-worker-machine-auth
          pnpm exec tsc -p workers/marketing-capi-dispatcher/tsconfig.json
      - name: Auth runtime readiness signal
        run: pnpm verify:auth-runtime-readiness
      - name: REL-102 Kakao closure
        run: pnpm verify:login-kakao-closure
      - name: Database TLS strict
        run: pnpm verify:database-tls-strict
      - name: REL-222 admin ops 3-mode
        run: pnpm verify:rel-222-admin-ops
      - name: REL-223 match control verbs
        run: pnpm verify:rel-223-match-control
      - name: REL-224 source policy versions
        run: pnpm verify:rel-224-source-policy
      - name: REL-409 admin R6 cert
        run: pnpm verify:rel-409-r6-cert
      - name: REL-500 QA lab expansion
        run: pnpm verify:rel-500-qa-lab-expansion
      - name: REL-501 money red-team
        run: pnpm verify:rel-501-money-red-team
      - name: REL-502 final engine acceptance
        run: pnpm verify:rel-502-final-engine-acceptance
      - name: REL-503 protected-scope STALE watch
        run: pnpm verify:rel-503-protected-scope-watch
      - name: REL-504 migration readiness
        run: pnpm verify:rel-504-migration-readiness
      - name: REL-505 R7 backend alignment
        run: pnpm verify:rel-505-r7-backend-alignment
      - name: REL-508 current-fx Nest wire
        run: pnpm verify:rel-508-current-fx-approx
      - name: REL-506 R8 infra core
        run: pnpm verify:rel-506-r8-infra-core
      - name: REL-507 production E2E
        run: pnpm verify:rel-507-production-e2e
      - name: REL-600 staging
        run: pnpm verify:rel-600-staging
      - name: REL-601 staging regression
        run: pnpm verify:rel-601-staging-regression
      - name: REL-602 staging rollback
        run: pnpm verify:rel-602-staging-rollback
      - name: REL-603 automated age usability cohort
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm verify:rel-603-age-usability-spotcheck
      - name: Stub .env for Docker-less stack-lock
        run: printf 'SUPABASE_URL=https://mgsytcetsiecllmhcyox.supabase.co\n' > .env
      - name: cargo test (services/engine-rust — Rule Engine R1-R10 golden unit tests)
        working-directory: services/engine-rust
        run: |
          cargo check --locked
          cargo test --locked
      - name: verify:gate
        run: pnpm verify:gate
      - name: OpenNext build:cf (Linux — Workers deploy output SSOT)
        run: |
          pnpm --filter @aipo/web build:cf
          pnpm --filter @aipo/admin build:cf
          test -f apps/web/.open-next/worker.js
          test -d apps/web/.open-next/assets
          test -f apps/admin/.open-next/worker.js
          test -d apps/admin/.open-next/assets

  late-release-audit:
    name: late-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: REL-503 protected-scope STALE watch
        id: rel503
        continue-on-error: true
        run: pnpm verify:rel-503-protected-scope-watch
      - name: REL-504 migration readiness
        id: rel504
        continue-on-error: true
        run: pnpm verify:rel-504-migration-readiness
      - name: REL-505 R7 backend alignment
        id: rel505
        continue-on-error: true
        run: pnpm verify:rel-505-r7-backend-alignment
      - name: REL-508 current-fx Nest wire
        id: rel508
        continue-on-error: true
        run: pnpm verify:rel-508-current-fx-approx
      - name: REL-506 R8 infra core
        id: rel506
        continue-on-error: true
        run: pnpm verify:rel-506-r8-infra-core
      - name: REL-507 production E2E
        id: rel507
        continue-on-error: true
        run: pnpm verify:rel-507-production-e2e
      - name: REL-600 staging
        id: rel600
        continue-on-error: true
        run: pnpm verify:rel-600-staging
      - name: REL-601 staging regression
        id: rel601
        continue-on-error: true
        run: pnpm verify:rel-601-staging-regression
      - name: REL-602 staging rollback
        id: rel602
        continue-on-error: true
        run: pnpm verify:rel-602-staging-rollback
      - name: REL-603 automated age usability cohort
        id: rel603
        continue-on-error: true
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm verify:rel-603-age-usability-spotcheck
      - name: Stub .env for Docker-less stack-lock
        run: printf 'SUPABASE_URL=https://mgsytcetsiecllmhcyox.supabase.co\n' > .env
      - name: cargo test (services/engine-rust — Rule Engine R1-R10 golden unit tests)
        id: cargo
        continue-on-error: true
        working-directory: services/engine-rust
        run: |
          cargo check --locked
          cargo test --locked
      - name: OpenNext build:cf (Linux — Workers deploy output SSOT)
        id: opennext
        continue-on-error: true
        run: |
          pnpm --filter @aipo/web build:cf
          pnpm --filter @aipo/admin build:cf
          test -f apps/web/.open-next/worker.js
          test -d apps/web/.open-next/assets
          test -f apps/admin/.open-next/worker.js
          test -d apps/admin/.open-next/assets
      - name: Late release audit verdict
        env:
          REL503: ${{ steps.rel503.outcome }}
          REL504: ${{ steps.rel504.outcome }}
          REL505: ${{ steps.rel505.outcome }}
          REL508: ${{ steps.rel508.outcome }}
          REL506: ${{ steps.rel506.outcome }}
          REL507: ${{ steps.rel507.outcome }}
          REL600: ${{ steps.rel600.outcome }}
          REL601: ${{ steps.rel601.outcome }}
          REL602: ${{ steps.rel602.outcome }}
          REL603: ${{ steps.rel603.outcome }}
          CARGO: ${{ steps.cargo.outcome }}
          OPENNEXT: ${{ steps.opennext.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "REL503=$REL503" "REL504=$REL504" "REL505=$REL505" \
            "REL508=$REL508" "REL506=$REL506" "REL507=$REL507" \
            "REL600=$REL600" "REL601=$REL601" "REL602=$REL602" \
            "REL603=$REL603" "CARGO=$CARGO" "OPENNEXT=$OPENNEXT"
          failed=0
          for value in "$REL503" "$REL504" "$REL505" "$REL508" "$REL506" "$REL507" \
                       "$REL600" "$REL601" "$REL602" "$REL603" "$CARGO" "$OPENNEXT"; do
            [ "$value" = "success" ] || failed=1
          done
          [ "$failed" -eq 0 ]

