name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Stub .env for Docker-less stack-lock
        run: printf 'SUPABASE_URL=https://mgsytcetsiecllmhcyox.supabase.co\n' > .env
      - name: cargo test (services/engine-rust — Rule Engine R1-R10 golden unit tests)
        working-directory: services/engine-rust
        run: |
          cargo check --locked
          cargo test --locked
      - name: verify:gate
        run: pnpm verify:gate
      - name: OpenNext build:cf (Linux — deploy output SSOT)
        run: |
          pnpm --filter @aipo/web build:cf
          pnpm --filter @aipo/admin build:cf
          test -d apps/web/.open-next/cloudflare
          test -d apps/admin/.open-next/cloudflare
