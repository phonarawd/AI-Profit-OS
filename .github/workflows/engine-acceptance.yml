# 02.5 Engine Acceptance QA — dedicated workflow (NOT part of verify:gate T2 heavy suites)
name: engine-acceptance

on:
  workflow_dispatch:
    inputs:
      qa_phase:
        description: "QA phase to run (qa0 / qa1 / qa2 / qa3 / qa4 / qa5 / qa6 / later suites)"
        required: true
        default: "qa6"
        type: choice
        options:
          - qa0
          - qa1
          - qa2
          - qa3
          - qa4
          - qa5
          - qa6
          - full
  pull_request:
    paths:
      - "governance/engine-acceptance/**"
      - "tooling/engine-acceptance/**"
      - "tooling/verify/engine-acceptance.cjs"
      - ".github/workflows/engine-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "governance/engine-acceptance/**"
      - "tooling/engine-acceptance/**"
      - "tooling/verify/engine-acceptance.cjs"
      - ".github/workflows/engine-acceptance.yml"

# 동일 QA 환경 동시 파괴 방지
concurrency:
  group: engine-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa0-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Kill-switch before smoke
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Tiny smoke (post kill-switch)
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/tiny-smoke.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci

  qa1-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.qa_phase == 'qa1' || inputs.qa_phase == 'qa2' || inputs.qa_phase == 'qa3' || inputs.qa_phase == 'qa4' || inputs.qa_phase == 'qa5' || inputs.qa_phase == 'qa6' || inputs.qa_phase == 'full' || inputs.qa_phase == 'qa0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Kill-switch before QA1
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Run QA1 deterministic truth
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/run-qa1.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci

  qa2-synthetic-personas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [qa1-deterministic]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.qa_phase == 'qa2' || inputs.qa_phase == 'qa3' || inputs.qa_phase == 'qa4' || inputs.qa_phase == 'qa5' || inputs.qa_phase == 'qa6' || inputs.qa_phase == 'full' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Kill-switch before QA2
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Run QA2 synthetic personas (full mapping)
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/run-qa2.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci

  # QA3+ matrix — fail-fast:false (전수 조사 · 조기 취소 금지)
  qa-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [qa2-synthetic-personas]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.qa_phase == 'qa3' || inputs.qa_phase == 'qa4' || inputs.qa_phase == 'qa5' || inputs.qa_phase == 'qa6' || inputs.qa_phase == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [QA3, QA4, QA5, QA6, QA7, QA8]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Kill-switch before matrix suite
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
        run: node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Run matrix suite
        env:
          AIPO_QA_TARGET_ENV: ci
          AIPO_QA_HOSTNAME: localhost
          AIPO_QA_SYNTHETIC_NS: qa-synth-ci
          MATRIX_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "${MATRIX_SUITE}" in
            QA3)
              node tooling/engine-acceptance/run-qa3.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
              ;;
            QA4)
              node tooling/engine-acceptance/run-qa4.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
              ;;
            QA5)
              # CI fault · axis1 degradation/fallback · axis2 post-recovery
              node tooling/engine-acceptance/run-qa5.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
              ;;
            QA6)
              # CI only heavy · k6 scenario mix · UNSPECIFIED_PERF_BUDGET if no product SLO
              node tooling/engine-acceptance/run-qa6.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
              pnpm verify:engine-acceptance
              ;;
            *)
              echo "suite=${MATRIX_SUITE} — not enabled yet at QA-6 (placeholder COMPLETE=0)"
              exit 0
              ;;
          esac
      # Raw traces/logs = Actions artifact · acceptance evidence retention ≥ 90 days
      - name: Upload suite evidence
        if: ${{ always() && (matrix.suite == 'QA3' || matrix.suite == 'QA4' || matrix.suite == 'QA5' || matrix.suite == 'QA6') }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-acceptance-${{ matrix.suite }}
          path: |
            governance/engine-acceptance/qa3-result.v1.json
            governance/engine-acceptance/qa4-result.v1.json
            governance/engine-acceptance/qa5-result.v1.json
            governance/engine-acceptance/qa6-result.v1.json
            governance/engine-acceptance/perf-budget.v1.json
            governance/engine-acceptance/defects.v1.json
            governance/engine-acceptance/evidence-manifest.v1.json
            governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md
          # acceptance evidence retention ≥ 90 days (L5)
          retention-days: 90
          if-no-files-found: ignore

  # 선행 job 실패/스킵 후에도 최종 증거 집계 (전수 조사 철학 · if: always())
  aggregator:
    needs: [qa0-baseline, qa1-deterministic, qa2-synthetic-personas, qa-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Aggregate evidence (always)
        run: |
          mkdir -p _tmp_engine_acceptance_evidence
          cp governance/engine-acceptance/evidence-manifest.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/baseline.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/qa1-result.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/qa2-result.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/qa3-result.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/qa4-result.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/qa5-result.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/qa6-result.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/perf-budget.v1.json _tmp_engine_acceptance_evidence/ || true
          cp governance/engine-acceptance/defects.v1.json _tmp_engine_acceptance_evidence/ || true
          echo "aggregator_status=ran" > _tmp_engine_acceptance_evidence/aggregator.txt
          echo "aggregator_if=always()" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "artifact_retention_days=90" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "qa0_result=${{ needs.qa0-baseline.result }}" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "qa1_result=${{ needs.qa1-deterministic.result }}" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "qa2_result=${{ needs.qa2-synthetic-personas.result }}" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "matrix_result=${{ needs.qa-matrix.result }}" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "strategy_fail_fast=false" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "concurrency_group=engine-acceptance-${{ github.ref }}" >> _tmp_engine_acceptance_evidence/aggregator.txt
          echo "qa6_ci_only_heavy=true" >> _tmp_engine_acceptance_evidence/aggregator.txt
      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-acceptance-evidence
          path: _tmp_engine_acceptance_evidence/
          # acceptance evidence retention ≥ 90 days (L5 · raw traces in Actions only)
          retention-days: 90
