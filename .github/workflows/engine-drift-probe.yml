name: engine-drift-probe

on:
  pull_request:
    branches:
      - recovery/release-provenance-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Print canonical live protected scope
        run: |
          node - <<'NODE'
          const psm = require("./tooling/verify/lib/rel-502-psm.cjs");
          console.log("ENGINE_DRIFT_JSON=" + JSON.stringify(psm.compareProtectedScope()));
          NODE
