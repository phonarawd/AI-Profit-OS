name: gpt-db-hardening-readiness-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/db-hardening-readiness-649368a
    paths:
      - ".github/workflows/gpt-db-hardening-readiness-ci.yml"
      - "tooling/release/db-hardening-readiness.cjs"
      - "tooling/verify/db-hardening-readiness.cjs"
      - "supabase/staging/20260901120000_admin_audit_append_only.sql"
      - "supabase/staging/20260901120100_push_rls.sql"
      - "supabase/staging/20260901120200_default_acl.sql"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify read-only DB hardening comparator
        run: node tooling/verify/db-hardening-readiness.cjs
