name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      surface:
        description: "What to deploy to staging preview workers"
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - ops
  # Temporary branch-only staging trigger for PR #51 validation.
  # Production hosts remain forbidden by cf-preflight/domain manifest.
  push:
    branches:
      - feat/consumer-spark-dash-worldclass
    paths:
      - ".github/workflows/deploy-staging.yml"

concurrency:
  group: cf-staging-${{ github.ref }}-${{ inputs.surface || 'web-pr51' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Origin lock
        run: pnpm verify:opennext-workers-origin

      # rewrite 전용 — NEXT_PUBLIC_API_BASE 비움(브라우저 same-origin /api/v1 → Worker fetch Render)
      - name: Preview API proxy env
        env:
          API_HOST: ${{ secrets.API_HOST }}
        run: |
          API="${API_HOST:-https://ai-profit-os.onrender.com}"
          case "$API" in
            http://*|https://*) ;;
            *) API="https://$API" ;;
          esac
          printf 'API_HOST=%s\n' "$API" >> .env

      - name: Deploy web staging
        if: github.event_name == 'push' || inputs.surface == 'web' || inputs.surface == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-preflight.cjs staging web && node tooling/deploy/cf-pages-web.cjs staging

      - name: Deploy ops staging
        if: github.event_name == 'workflow_dispatch' && (inputs.surface == 'ops' || inputs.surface == 'all')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-preflight.cjs staging ops && node tooling/deploy/cf-pages-ops.cjs staging
