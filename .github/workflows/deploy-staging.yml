name: deploy-staging

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "preview = REL-600 (not J0). dedicated = S5 J0 host. never production."
        required: true
        default: preview
        type: choice
        options:
          - preview
          - dedicated
      surface:
        description: "What to deploy to the chosen staging slot"
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - ops

concurrency:
  group: cf-staging-${{ github.ref }}-${{ inputs.slot }}-${{ inputs.surface }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Origin lock
        run: pnpm verify:opennext-workers-origin

      - name: Reject production slot
        run: |
          test "${{ inputs.slot }}" != "production"
          test "${{ inputs.slot }}" = "preview" || test "${{ inputs.slot }}" = "dedicated"

      # rewrite 전용 — production API_HOST/Render 기본값 금지. 명시적 STAGING_API_HOST만.
      - name: Staging API proxy env
        env:
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
          DEPLOY_SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          test -n "${STAGING_API_HOST:-}" || {
            echo "Missing STAGING_API_HOST — staging must not inherit production API_HOST"
            exit 1
          }
          API="$STAGING_API_HOST"
          case "$API" in
            http://*|https://*) ;;
            *) API="https://$API" ;;
          esac
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("infra/domain.manifest.json", "utf8"));
            const slot = process.env.DEPLOY_SLOT || "preview";
            const denied = new Set([
              ...(manifest.openNext.staging.forbiddenHosts || []),
              ...((manifest.openNext.dedicated && manifest.openNext.dedicated.forbiddenHosts) || []),
            ]);
            const raw = process.argv[1];
            let host;
            try { host = new URL(raw).hostname; } catch {
              console.error("STAGING_API_HOST is not a valid URL");
              process.exit(1);
            }
            if (denied.has(host)) {
              console.error("STAGING_API_HOST targets a forbidden host: " + host);
              process.exit(1);
            }
            if (slot !== "preview" && slot !== "dedicated") {
              console.error("DEPLOY_SLOT must be preview or dedicated");
              process.exit(1);
            }
          ' "$API"
          printf 'API_HOST=%s\n' "$API" >> .env

      - name: Deploy web
        if: inputs.surface == 'web' || inputs.surface == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          TARGET="${{ inputs.slot }}"
          if [ "$TARGET" = "preview" ]; then TARGET=staging; fi
          node tooling/deploy/cf-preflight.cjs "$TARGET" web
          node tooling/deploy/cf-pages-web.cjs "$TARGET"

      - name: Deploy ops
        if: inputs.surface == 'ops' || inputs.surface == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_API_HOST: ${{ secrets.STAGING_API_HOST }}
        run: |
          TARGET="${{ inputs.slot }}"
          if [ "$TARGET" = "preview" ]; then TARGET=staging; fi
          node tooling/deploy/cf-preflight.cjs "$TARGET" ops
          node tooling/deploy/cf-pages-ops.cjs "$TARGET"

      - name: Origin smoke
        if: inputs.surface == 'web' || inputs.surface == 'ops' || inputs.surface == 'all'
        run: |
          SLOT="${{ inputs.slot }}"
          if [ "$SLOT" = "preview" ]; then SLOT=staging; fi
          case "${{ inputs.surface }}" in
            web) node tooling/deploy/cf-origin-smoke.cjs web "$SLOT" ;;
            ops) node tooling/deploy/cf-origin-smoke.cjs ops "$SLOT" ;;
            *) node tooling/deploy/cf-origin-smoke.cjs all "$SLOT" ;;
          esac
