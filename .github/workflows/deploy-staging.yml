name: deploy-staging

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      surface:
        description: "What to deploy to staging preview workers"
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - ops

concurrency:
  group: cf-staging-${{ github.ref }}-${{ inputs.surface }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Origin lock
        run: pnpm verify:opennext-workers-origin

      # rewrite 전용 — NEXT_PUBLIC_API_BASE 비움(브라우저 same-origin /api/v1 → Worker fetch Render)
      - name: Preview API proxy env
        env:
          API_HOST: ${{ secrets.API_HOST }}
        run: |
          API="${API_HOST:-https://ai-profit-os.onrender.com}"
          case "$API" in
            http://*|https://*) ;;
            *) API="https://$API" ;;
          esac
          printf 'API_HOST=%s\n' "$API" >> .env

      - name: Deploy web staging
        if: inputs.surface == 'web' || inputs.surface == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-preflight.cjs staging web && node tooling/deploy/cf-pages-web.cjs staging

      - name: Deploy ops staging
        if: inputs.surface == 'ops' || inputs.surface == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/deploy/cf-preflight.cjs staging ops && node tooling/deploy/cf-pages-ops.cjs staging
