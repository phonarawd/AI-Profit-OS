name: rel-502-qa8-formal-once
on:
  push:
    branches:
      - release/auth-wallet-rel502-v1-20260828
permissions:
  contents: write
concurrency:
  group: rel-502-qa8-formal-once
  cancel-in-progress: false
env:
  AIPO_QA8_MARKER: "chore(rel-502): start QA8 formal acceptance"
  AIPO_QA8_PERSIST_SUBJECT: "chore(engine-acceptance): persist current-epoch QA8 evidence"
  AIPO_QA8_BASELINE_ID: "ea-baseline-cc627efc3ee2-defdfa5b6ac4"
  AIPO_QA7_RUN_ID: "33155687092"
  AIPO_QA7_CHECKSUM: "5fd75a148c3ad125be041410d1cabd2e1ffe0c4642164410aca3883530354896"
  AIPO_QA_TARGET_ENV: ci
  AIPO_QA_HOSTNAME: localhost
  AIPO_QA_SYNTHETIC_NS: qa-synth-ci
  AIPO_QA_PGHOST: 127.0.0.1
  AIPO_QA_PGUSER: postgres
  AIPO_QA_PGPASSWORD: postgres
  AIPO_QA_PGDATABASE: aipo_qa_synth
  AIPO_QA_PGPORT: "5432"
  AIPO_QA_HARNESS_OUT: /tmp/aipo-harness/qa8-adversarial
jobs:
  qa8-formal:
    if: >-
      github.repository == 'phonarawd/AI-Profit-OS' &&
      github.ref == 'refs/heads/release/auth-wallet-rel502-v1-20260828' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(rel-502): start QA8 formal acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aipo_qa_synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipo_qa_synth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fail-closed post-QA7 epoch guard
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "phonarawd/AI-Profit-OS"
          test "${GITHUB_REF}" = "refs/heads/release/auth-wallet-rel502-v1-20260828"
          test "$(git log -1 --pretty=%s)" = "${AIPO_QA8_MARKER}"
          test -z "$(git status --porcelain)"
          node <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('governance/engine-acceptance/baseline.v1.json','utf8'));
          const e=JSON.parse(fs.readFileSync('governance/engine-acceptance/evidence-manifest.v1.json','utf8'));
          const q7=JSON.parse(fs.readFileSync('governance/engine-acceptance/qa7-result.v1.json','utf8'));
          const s7=e.suites.find(x=>x.suite_id==='QA7'), s8=e.suites.find(x=>x.suite_id==='QA8'), s9=e.suites.find(x=>x.suite_id==='QA9');
          const bad=m=>{throw new Error(m)};
          if(b.id!==process.env.AIPO_QA8_BASELINE_ID||b.valid!==true) bad('baseline');
          if(e.qa_phase!=='QA-7'||e.next!=='QA8_SECURITY_PRIVACY'||e.verdict!=='ENGINE_QA_INCOMPLETE') bad('state');
          if(!s7||s7.completion_status!=='COMPLETE'||String(s7.run_id)!==process.env.AIPO_QA7_RUN_ID||s7.checksum!==process.env.AIPO_QA7_CHECKSUM||s7.formal_actions_evidence!==true) bad('qa7 slot');
          if(q7.baseline_id!==b.id||String(q7.run_id)!==process.env.AIPO_QA7_RUN_ID||q7.checksum!==process.env.AIPO_QA7_CHECKSUM) bad('qa7 result');
          if(!s8||s8.completion_status!=='NOT_STARTED'||s8.run_id!==null||s8.checksum!==null) bad('qa8 pending');
          if(!s9||s9.completion_status!=='NOT_STARTED'||s9.run_id!==null||s9.checksum!==null||s9.current_epoch_authoritative!==false) bad('qa9 pending');
          const x=e.current_epoch||{};
          if(x.qa1_qa6_status!=='STALE_PENDING_RERUN'||x.qa8_status!=='STALE_PENDING_RERUN'||x.qa9_status!=='STALE_AGGREGATION_PENDING_DISCOVERY') bad('snapshot');
          NODE
          pnpm verify:engine-acceptance
      - name: Kill-switch + isolated DB target
        run: node tooling/engine-acceptance/kill-switch.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci --assert-db-target
      - name: Build @aipo/api-nest
        run: |
          set -euo pipefail
          pnpm --filter @aipo/api-nest build
          test -f services/api-nest/dist/main.js
      - name: Run QA8 booted-Nest adversarial HTTP
        run: node tooling/engine-acceptance/run-qa8-adversarial.cjs --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Upload QA8 adversarial harness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rel-502-QA8-adversarial-formal
          path: /tmp/aipo-harness/qa8-adversarial/
          retention-days: 90
          if-no-files-found: error
      - name: Run canonical QA8 full
        run: node tooling/engine-acceptance/run-qa8.cjs --mode full --target-env ci --hostname localhost --synthetic-ns qa-synth-ci
      - name: Validate QA8 formal state and full verifier
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const b=JSON.parse(fs.readFileSync('governance/engine-acceptance/baseline.v1.json','utf8'));
          const e=JSON.parse(fs.readFileSync('governance/engine-acceptance/evidence-manifest.v1.json','utf8'));
          const q7=JSON.parse(fs.readFileSync('governance/engine-acceptance/qa7-result.v1.json','utf8'));
          const q8=JSON.parse(fs.readFileSync('governance/engine-acceptance/qa8-result.v1.json','utf8'));
          const d=JSON.parse(fs.readFileSync('governance/engine-acceptance/defects.v1.json','utf8'));
          const r=fs.readFileSync('governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md','utf8');
          const s7=e.suites.find(x=>x.suite_id==='QA7'),s8=e.suites.find(x=>x.suite_id==='QA8'),s9=e.suites.find(x=>x.suite_id==='QA9');
          const bad=m=>{throw new Error(m)};
          if(q8.baseline_id!==b.id||q8.completion_status!=='COMPLETE'||q8.mode!=='full'||q8.asvs_version!=='5.0.0'||q8.next!=='QA9_ACCEPTANCE_REPORT'||q8.product_mutation!==0) bad('qa8 result');
          const copy={...q8}; delete copy.checksum;
          if(crypto.createHash('sha256').update(JSON.stringify(copy)+'\n','utf8').digest('hex')!==q8.checksum) bad('checksum');
          if(e.qa_phase!=='QA-8'||e.next!=='QA9_ACCEPTANCE_REPORT'||e.evidence_integrity!=='VALID') bad('evidence');
          if(!s7||s7.completion_status!=='COMPLETE'||s7.checksum!==q7.checksum||String(s7.run_id)!==String(q7.run_id)) bad('qa7');
          if(!s8||s8.completion_status!=='COMPLETE'||s8.checksum!==q8.checksum||String(s8.run_id)!==String(q8.run_id)||s8.mode!=='full') bad('qa8 slot');
          if(!s9||s9.completion_status!=='NOT_STARTED'||s9.run_id!==null||s9.checksum!==null||s9.current_epoch_authoritative!==false) bad('qa9');
          const p0=d.counts?.P0||0,p1=d.counts?.P1||0,expected=p0+p1>0?'ENGINE_NOT_ACCEPTED':'ENGINE_QA_INCOMPLETE';
          if(e.verdict!==expected||q8.verdict_contribution!==expected) bad('verdict');
          if(JSON.stringify(d.counts)!==JSON.stringify(q8.defects_counts)) bad('defects');
          const ci=e.critical_invariant||{},qci=q8.critical_invariant_cumulative||{};
          for(const k of ['blocked','skipped','uncovered']) if((ci[k]||0)!==(qci[k]||0)) bad('critical '+k);
          const x=e.current_epoch||{};
          if(x.qa1_qa6_status!=='STALE_PENDING_RERUN'||x.qa8_status!=='STALE_PENDING_RERUN'||x.qa9_status!=='STALE_AGGREGATION_PENDING_DISCOVERY') bad('snapshot');
          if(!r.includes('QA8 = COMPLETE')||!r.includes('NEXT = QA9_ACCEPTANCE_REPORT')||!r.includes('ENGINE_ACCEPTED_FOR_UI = NOT_ISSUED')||!r.includes('PRODUCT MUTATION = 0')) bad('report');
          NODE
          pnpm verify:engine-acceptance
      - name: Upload QA8 governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rel-502-QA8-formal-governance
          path: |
            governance/engine-acceptance/qa8-result.v1.json
            governance/engine-acceptance/defects.v1.json
            governance/engine-acceptance/evidence-manifest.v1.json
            governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md
            governance/engine-acceptance/coverage.v1.json
          retention-days: 90
          if-no-files-found: error
      - name: Enforce governance-only diff, persist, remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md
            governance/engine-acceptance/baseline.v1.json
            governance/engine-acceptance/coverage.v1.json
            governance/engine-acceptance/defects.v1.json
            governance/engine-acceptance/evidence-manifest.v1.json
            governance/engine-acceptance/qa8-result.v1.json
          )
          declare -A ok=()
          for p in "${allowed[@]}"; do ok["$p"]=1; done
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -ge 4
          for p in "${changed[@]}"; do test -n "${ok[$p]:-}" || { echo "forbidden diff: $p"; exit 1; }; done
          for required in governance/engine-acceptance/qa8-result.v1.json governance/engine-acceptance/defects.v1.json governance/engine-acceptance/evidence-manifest.v1.json governance/engine-acceptance/ENGINE_ACCEPTANCE_REPORT.md; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null
          done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${allowed[@]}"
          git rm .github/workflows/rel-502-qa8-formal-once.yml
          git diff --cached --check
          git commit -m "${AIPO_QA8_PERSIST_SUBJECT}"
          git push origin "HEAD:release/auth-wallet-rel502-v1-20260828"
