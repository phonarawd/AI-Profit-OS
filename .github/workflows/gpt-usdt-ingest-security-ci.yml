name: gpt-usdt-ingest-security-ci

permissions:
  contents: read

on:
  push:
    branches:
      - gpt/security-usdt-ingest-e4961df
    paths:
      - ".github/workflows/gpt-usdt-ingest-security-ci.yml"
      - "services/api-nest/src/wallet/wallet.controller.ts"
      - "services/api-nest/src/wallet/usdt-deposit.service.ts"
      - "services/api-nest/src/wallet/chain-watcher.phase0.service.ts"
      - "tooling/verify/usdt-ingest-machine-auth.cjs"
      - "services/api-nest/package.json"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Static ingest security proof
        run: node tooling/verify/usdt-ingest-machine-auth.cjs
      - name: Existing money auth verifier
        run: pnpm verify:money-wallet-auth-remediation
      - name: Build Nest API
        run: pnpm --filter @aipo/api-nest... build
