name: gpt-db-owner-scoped-acl

on:
  pull_request:
    branches:
      - recovery/release-provenance-20260831
    paths:
      - tooling/release/db-hardening-readiness.cjs
      - tooling/verify/db-hardening-readiness.cjs
      - supabase/staging/20260901120200_default_acl.sql
      - governance/recovery/supabase-app-owner-boundary.20260902.v1.json
      - .github/workflows/gpt-db-owner-scoped-acl-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-scoped-default-acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify owner-scoped DB hardening readiness
        run: node tooling/verify/db-hardening-readiness.cjs
