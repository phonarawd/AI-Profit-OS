name: backend-setup
description: pnpm 10.14.0 · Node 22 · pnpm store cache · pnpm install --frozen-lockfile (backend-ci common setup)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      with:
        version: 10.14.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "22"
        cache: "pnpm"
    - name: Install (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
