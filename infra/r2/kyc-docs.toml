# Cloudflare R2 — KYC document archive (Money §42 · Infra §15 Bootstrap)
# Bucket name locked: kyc-docs
# Secrets (account id / API token) live in .env only — never commit.

bucket_name = "kyc-docs"
purpose = "kyc-docs"
# Private object storage — no public ACL. Nest service_role path only.
public_access = false

# Bind later from workers or Nest via S3-compatible API:
# R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_KYC_BUCKET=kyc-docs

[lifecycle]
# Retention pointer — Money §42.2.1 owns policy numbers; Infra owns bucket only.
note = "delete-account archives retained per Money KYC retention; ops never mounts on apps/web"
